<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>🥷 Математический Ниндзя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        /* ФОНОВЫЕ ЭЛЕМЕНТЫ */
        .sakura {
            position: fixed;
            width: 15px;
            height: 15px;
            background: #FFB7C5;
            border-radius: 50%;
            opacity: 0.6;
            animation: fall linear infinite;
            pointer-events: none;
        }

        @keyframes fall {
            0% { transform: translateY(-100px) rotate(0deg); opacity: 0.6; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }

        .container {
            width: 100%;
            height: 100vh;
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
        }

        /* ГЛАВНОЕ МЕНЮ */
        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .menu-screen.hidden {
            display: none;
        }

        .game-title {
            font-size: clamp(3em, 8vw, 5em);
            color: #FFD700;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            animation: titlePulse 2s ease-in-out infinite;
            text-align: center;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .player-info {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: clamp(20px, 5vw, 30px);
            margin-bottom: 30px;
            border: 3px solid #FFD700;
            text-align: center;
            max-width: 400px;
            width: 100%;
        }

        .player-level {
            font-size: clamp(1.5em, 4vw, 2em);
            color: white;
            margin-bottom: 10px;
        }

        .belt-display {
            font-size: clamp(2em, 6vw, 3em);
            margin: 10px 0;
        }

        .xp-bar-container {
            background: rgba(0, 0, 0, 0.3);
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 15px;
            border: 2px solid #FFD700;
        }

        .xp-bar {
            background: linear-gradient(90deg, #FFD700, #FFA500);
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: clamp(12px, 3vw, 18px) clamp(25px, 6vw, 50px);
            font-size: clamp(1.1em, 3vw, 1.5em);
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            width: 100%;
        }

        .menu-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 30px rgba(255, 107, 107, 0.6);
        }

        /* ВЫБОР ПОЯСА */
        .belt-selection {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .belt-selection.active {
            display: flex;
        }

        .belt-title {
            font-size: clamp(2em, 6vw, 3em);
            color: #FFD700;
            margin-bottom: 30px;
        }

        .belt-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            width: 100%;
            max-width: 600px;
        }

        .belt-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            text-align: center;
        }

        .belt-card:hover:not(.locked) {
            transform: translateY(-5px);
            border-color: #FFD700;
        }

        .belt-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .belt-icon {
            font-size: clamp(3em, 8vw, 4em);
            margin-bottom: 10px;
        }

        .belt-name {
            font-size: clamp(1.2em, 3vw, 1.5em);
            color: white;
            margin-bottom: 10px;
        }

        .belt-desc {
            font-size: clamp(0.9em, 2vw, 1em);
            color: #ccc;
        }

        /* ИГРОВОЙ ЭКРАН */
        .game-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            position: relative;
        }

        .game-screen.active {
            display: flex;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .game-header {
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #FFD700;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        .score-display {
            font-size: clamp(1.3em, 3.5vw, 1.8em);
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .timer {
            font-size: clamp(1.8em, 5vw, 2.5em);
            color: #4CAF50;
            font-weight: bold;
        }

        .timer.warning {
            color: #FF6B6B;
            animation: timerBlink 0.5s ease-in-out infinite;
        }

        @keyframes timerBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .combo-display {
            font-size: clamp(1.2em, 3vw, 1.6em);
            color: #FF6B6B;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.7);
            font-weight: bold;
        }

        /* ПРИМЕР ВВЕРХУ */
        .question-area {
            padding: 30px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 3px solid #FFD700;
        }

        .question-display {
            font-size: clamp(2.5em, 7vw, 4em);
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }

        /* ИГРОВАЯ ОБЛАСТЬ */
        .game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* ФРУКТЫ-ОТВЕТЫ */
        .fruit {
            position: absolute;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
        }

        .fruit-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
            border: 4px solid #FFD700;
        }

        .fruit-number {
            position: relative;
            font-size: 2.5em;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .fruit.slashed {
            pointer-events: none;
        }

        .fruit.slashed .fruit-bg {
            animation: fruitExplode 0.5s ease-out forwards;
        }

        @keyframes fruitExplode {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        /* ЭФФЕКТ РАЗРЕЗАНИЯ */
        .slash-effect {
            position: fixed;
            font-size: 5em;
            color: #FFD700;
            pointer-events: none;
            z-index: 1000;
            animation: slashAnim 0.6s ease-out forwards;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
        }

        @keyframes slashAnim {
            0% { transform: scale(0) rotate(-45deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: scale(2) rotate(45deg); opacity: 0; }
        }

        /* ВСПЛЫВАЮЩИЕ ОЧКИ */
        .score-popup {
            position: fixed;
            font-size: 2.5em;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
            animation: scoreFloat 1s ease-out forwards;
            text-shadow: 0 0 15px currentColor;
        }

        .score-popup.plus {
            color: #4CAF50;
        }

        .score-popup.minus {
            color: #FF6B6B;
        }

        @keyframes scoreFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
        }

        /* ЧАСТИЦЫ */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 1.5em;
        }

        @keyframes particleFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); opacity: 0; }
        }

        /* ЭКРАН РЕЗУЛЬТАТОВ */
        .result-screen {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-screen.active {
            display: flex;
        }

        .result-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: clamp(30px, 5vw, 50px);
            border: 5px solid #FFD700;
            text-align: center;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .result-title {
            font-size: clamp(2.5em, 6vw, 4em);
            color: #FFD700;
            margin-bottom: 20px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .result-stat {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
        }

        .result-label {
            font-size: clamp(1em, 2vw, 1.2em);
            color: #ccc;
            margin-bottom: 8px;
        }

        .result-value {
            font-size: clamp(1.8em, 4vw, 3em);
            color: white;
            font-weight: bold;
        }

        .new-record {
            font-size: clamp(1.5em, 3vw, 2em);
            color: #FF6B6B;
            margin-bottom: 20px;
            animation: recordBlink 1s ease-in-out infinite;
        }

        @keyframes recordBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 768px) {
            .fruit {
                width: 100px;
                height: 100px;
            }

            .fruit-number {
                font-size: 2em;
            }

            .result-stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .fruit {
                width: 90px;
                height: 90px;
            }

            .fruit-number {
                font-size: 1.8em;
            }

            .question-display {
                font-size: clamp(2em, 6vw, 3em);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ГЛАВНОЕ МЕНЮ -->
        <div class="menu-screen" id="menuScreen">
            <div class="game-title">🥷 МАТЕМАТИЧЕСКИЙ<br>НИНДЗЯ</div>

            <div class="player-info">
                <div class="player-level">Уровень <span id="playerLevel">1</span></div>
                <div class="belt-display" id="currentBelt">⚪</div>
                <div style="color: white; font-size: 1.2em;" id="beltName">Белый пояс</div>
                <div class="xp-bar-container">
                    <div class="xp-bar" id="xpBar" style="width: 0%">
                        <span id="xpText">0 / 100 XP</span>
                    </div>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="menu-btn" onclick="gameManager.startGame()">⚔️ Начать тренировку</button>
                <button class="menu-btn" onclick="gameManager.startGame(true)" id="customGameBtn">📚 Играть со своими примерами</button>
                <button class="menu-btn" onclick="gameManager.showBeltSelection()">🥋 Выбрать пояс</button>
                <button class="menu-btn" onclick="gameManager.showCustomQuestions()">📝 Свои примеры</button>
            </div>
        </div>

        <!-- ЗАГРУЗКА ПРИМЕРОВ -->
        <div class="belt-selection" id="customQuestionsScreen">
            <div class="belt-title">Свои примеры</div>

            <div style="background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 20px; padding: 30px; max-width: 600px; width: 100%; border: 3px solid #FFD700; margin-bottom: 20px;">
                <div style="color: white; font-size: 1.2em; margin-bottom: 20px; text-align: center;">
                    Введите примеры построчно в формате:<br>
                    <span style="color: #FFD700;">вопрос | правильный ответ | неправильный1 | неправильный2</span>
                </div>

                <textarea id="customQuestionsInput" placeholder="Пример:&#10;2 + 2 | 4 | 3 | 5&#10;5 × 3 | 15 | 12 | 18&#10;10 − 4 | 6 | 5 | 7"
                    style="width: 100%; height: 200px; padding: 15px; font-size: 1.1em; border-radius: 10px; border: 2px solid #FFD700; background: rgba(0,0,0,0.3); color: white; font-family: monospace; resize: vertical;"></textarea>

                <div style="margin-top: 20px; text-align: center;">
                    <input type="file" id="fileInput" accept=".txt,.json" style="display: none;" onchange="gameManager.loadFromFile(event)">
                    <button class="menu-btn" onclick="document.getElementById('fileInput').click()" style="margin-bottom: 10px;">📂 Загрузить из файла</button>
                    <button class="menu-btn" onclick="gameManager.saveCustomQuestions()" style="margin-bottom: 10px;">✅ Сохранить примеры</button>
                    <div id="customQuestionsStatus" style="color: #4CAF50; margin-top: 10px; font-size: 1.1em;"></div>
                </div>
            </div>

            <button class="menu-btn" onclick="gameManager.showMenu()" style="max-width: 200px;">Назад</button>
        </div>

        <!-- ВЫБОР ПОЯСА -->
        <div class="belt-selection" id="beltSelection">
            <div class="belt-title">Выбери свой пояс</div>
            <div class="belt-grid" id="beltGrid"></div>
            <button class="menu-btn" onclick="gameManager.showMenu()" style="max-width: 200px;">Назад</button>
        </div>

        <!-- ИГРОВОЙ ЭКРАН -->
        <div class="game-screen" id="gameScreen">
            <div class="game-header">
                <div class="score-display">Очки: <span id="score">0</span></div>
                <div class="timer" id="timer">60</div>
                <div class="combo-display" id="comboDisplay"></div>
            </div>

            <div class="question-area">
                <div class="question-display" id="question">8 + 7 = ?</div>
            </div>

            <div class="game-area" id="gameArea"></div>
        </div>

        <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
        <div class="result-screen" id="resultScreen">
            <div class="result-container">
                <div class="result-title">🏆 РЕЗУЛЬТАТ</div>
                <div class="new-record" id="newRecord" style="display: none;">🔥 НОВЫЙ РЕКОРД!</div>

                <div class="result-stats">
                    <div class="result-stat">
                        <div class="result-label">Очки</div>
                        <div class="result-value" id="finalScore">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-label">Правильных</div>
                        <div class="result-value" id="finalCorrect">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-label">Ошибок</div>
                        <div class="result-value" id="finalWrong">0</div>
                    </div>
                    <div class="result-stat">
                        <div class="result-label">Макс комбо</div>
                        <div class="result-value" id="finalCombo">0</div>
                    </div>
                </div>

                <div class="menu-buttons">
                    <button class="menu-btn" onclick="gameManager.startGame()">Еще раз</button>
                    <button class="menu-btn" onclick="gameManager.showMenu()">В меню</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // =====================
        // МАТЕМАТИЧЕСКИЙ ГЕНЕРАТОР
        // =====================
        const questionGenerator = {
            generateAddition(maxNum = 20) {
                const a = Math.floor(Math.random() * (maxNum - 1)) + 1;
                const b = Math.floor(Math.random() * (maxNum - a)) + 1;
                const answer = a + b;
                return { text: `${a} + ${b}`, answer, type: 'addition', difficulty: 1 };
            },

            generateSubtraction(maxNum = 20) {
                const a = Math.floor(Math.random() * (maxNum - 5)) + 5;
                const b = Math.floor(Math.random() * a) + 1;
                const answer = a - b;
                return { text: `${a} − ${b}`, answer, type: 'subtraction', difficulty: 1 };
            },

            generateMultiplication(maxNum = 9) {
                const a = Math.floor(Math.random() * (maxNum - 1)) + 2;
                const b = Math.floor(Math.random() * (maxNum - 1)) + 2;
                const answer = a * b;
                return { text: `${a} × ${b}`, answer, type: 'multiplication', difficulty: 2 };
            },

            generateDivision() {
                const b = Math.floor(Math.random() * 7) + 2;
                const a = b * (Math.floor(Math.random() * 8) + 2);
                const answer = a / b;
                return { text: `${a} ÷ ${b}`, answer, type: 'division', difficulty: 2 };
            },

            generateWrongAnswers(correct, maxNum = 20) {
                const wrong = [];
                const attempts = [];
                for (let i = 1; i <= 3; i++) {
                    const offset = (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
                    attempts.push(Math.round(correct + offset));
                }
                return attempts.filter((v, i, a) => v > 0 && v !== correct && a.indexOf(v) === i).slice(0, 2);
            },

            generateQuestion(beltLevel) {
                let question;
                if (beltLevel === 0) {
                    question = Math.random() > 0.5 ? this.generateAddition(20) : this.generateSubtraction(20);
                } else if (beltLevel === 1) {
                    question = Math.random() > 0.5 ? this.generateAddition(100) : this.generateSubtraction(100);
                } else if (beltLevel === 2) {
                    question = Math.random() > 0.5 ? this.generateMultiplication(10) : this.generateDivision();
                }

                const wrongAnswers = this.generateWrongAnswers(question.answer, 100);
                const allAnswers = [question.answer, ...wrongAnswers].sort(() => Math.random() - 0.5);

                return {
                    text: question.text + ' = ?',
                    correct: question.answer,
                    options: allAnswers,
                    type: question.type,
                    difficulty: question.difficulty
                };
            }
        };

        // =====================
        // СИСТЕМА ХРАНЕНИЯ
        // =====================
        const storageManager = {
            save(data) {
                localStorage.setItem('mathNinjaData', JSON.stringify(data));
            },

            load() {
                const data = localStorage.getItem('mathNinjaData');
                return data ? JSON.parse(data) : this.getDefault();
            },

            getDefault() {
                return {
                    level: 1,
                    xp: 0,
                    belt: 0,
                    bestScore: 0,
                    bestCombo: 0,
                    customQuestions: []
                };
            },

            saveCustomQuestions(questions) {
                const data = this.load();
                data.customQuestions = questions;
                this.save(data);
            },

            loadCustomQuestions() {
                const data = this.load();
                return data.customQuestions || [];
            }
        };

        // =====================
        // МЕНЕДЖЕР ИГРЫ
        // =====================
        const gameManager = {
            playerData: {},
            currentBelt: 0,
            gameState: {},
            gameTimer: null,
            spawnInterval: null,
            customQuestions: [],
            useCustomQuestions: false,

            belts: [
                { icon: '⚪', name: 'Белый пояс', desc: '1 класс: до 20', xpRequired: 0 },
                { icon: '🟡', name: 'Желтый пояс', desc: '1-2 класс: до 100', xpRequired: 200 },
                { icon: '🟢', name: 'Зеленый пояс', desc: '2 класс: умножение', xpRequired: 500 }
            ],

            init() {
                this.playerData = storageManager.load();
                this.customQuestions = storageManager.loadCustomQuestions();
                this.updatePlayerInfo();
                this.renderBeltSelection();
                this.createSakura();

                // Загрузить сохранённые примеры в textarea
                if (this.customQuestions.length > 0) {
                    const textarea = document.getElementById('customQuestionsInput');
                    if (textarea) {
                        textarea.value = this.customQuestions.map(q =>
                            `${q.text.replace(' = ?', '')} | ${q.correct} | ${q.options.filter(o => o !== q.correct).join(' | ')}`
                        ).join('\n');
                    }
                }
            },

            showCustomQuestions() {
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('customQuestionsScreen').classList.add('active');
                document.getElementById('beltSelection').classList.remove('active');
            },

            saveCustomQuestions() {
                const textarea = document.getElementById('customQuestionsInput');
                const text = textarea.value.trim();

                if (!text) {
                    document.getElementById('customQuestionsStatus').textContent = '❌ Введите примеры!';
                    document.getElementById('customQuestionsStatus').style.color = '#FF6B6B';
                    return;
                }

                const lines = text.split('\n').filter(line => line.trim());
                const questions = [];

                for (let line of lines) {
                    const parts = line.split('|').map(p => p.trim());

                    if (parts.length < 2) {
                        document.getElementById('customQuestionsStatus').textContent = '❌ Неверный формат! Используйте: вопрос | ответ | неправильный1 | неправильный2';
                        document.getElementById('customQuestionsStatus').style.color = '#FF6B6B';
                        return;
                    }

                    const questionText = parts[0];
                    const correctAnswer = parseFloat(parts[1]);
                    const wrongAnswers = parts.slice(2).map(p => parseFloat(p)).filter(n => !isNaN(n));

                    // Если не указаны неправильные ответы, генерируем их
                    while (wrongAnswers.length < 2) {
                        const wrong = correctAnswer + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
                        if (wrong > 0 && wrong !== correctAnswer && !wrongAnswers.includes(wrong)) {
                            wrongAnswers.push(wrong);
                        }
                    }

                    const allOptions = [correctAnswer, ...wrongAnswers.slice(0, 2)].sort(() => Math.random() - 0.5);

                    questions.push({
                        text: questionText + ' = ?',
                        correct: correctAnswer,
                        options: allOptions
                    });
                }

                this.customQuestions = questions;
                storageManager.saveCustomQuestions(questions);

                document.getElementById('customQuestionsStatus').textContent = `✅ Сохранено ${questions.length} примеров!`;
                document.getElementById('customQuestionsStatus').style.color = '#4CAF50';

                setTimeout(() => {
                    document.getElementById('customQuestionsStatus').textContent = '';
                }, 3000);
            },

            loadFromFile(event) {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    const content = e.target.result;
                    document.getElementById('customQuestionsInput').value = content;
                    document.getElementById('customQuestionsStatus').textContent = '📂 Файл загружен! Нажмите "Сохранить примеры"';
                    document.getElementById('customQuestionsStatus').style.color = '#FFD700';
                };
                reader.readAsText(file);
            },

            updatePlayerInfo() {
                document.getElementById('playerLevel').textContent = this.playerData.level;
                document.getElementById('currentBelt').textContent = this.belts[this.playerData.belt].icon;
                document.getElementById('beltName').textContent = this.belts[this.playerData.belt].name;

                const nextLevelXP = this.playerData.level * 100;
                const xpPercent = (this.playerData.xp / nextLevelXP) * 100;
                document.getElementById('xpBar').style.width = xpPercent + '%';
                document.getElementById('xpText').textContent = `${this.playerData.xp} / ${nextLevelXP} XP`;
            },

            showMenu() {
                document.getElementById('menuScreen').classList.remove('hidden');
                document.getElementById('beltSelection').classList.remove('active');
                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('resultScreen').classList.remove('active');
                document.getElementById('customQuestionsScreen').classList.remove('active');
            },

            showBeltSelection() {
                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('beltSelection').classList.add('active');
            },

            renderBeltSelection() {
                const grid = document.getElementById('beltGrid');
                grid.innerHTML = '';

                this.belts.forEach((belt, index) => {
                    const card = document.createElement('div');
                    card.className = 'belt-card';

                    const totalXP = this.playerData.level * 100 + this.playerData.xp;
                    const isUnlocked = totalXP >= belt.xpRequired;

                    if (!isUnlocked) {
                        card.classList.add('locked');
                    }

                    card.innerHTML = `
                        <div class="belt-icon">${belt.icon}</div>
                        <div class="belt-name">${belt.name}</div>
                        <div class="belt-desc">${belt.desc}</div>
                        ${!isUnlocked ? `<div style="color: #FF6B6B; margin-top: 10px;">Требуется ${belt.xpRequired} XP</div>` : ''}
                    `;

                    if (isUnlocked) {
                        card.onclick = () => {
                            this.currentBelt = index;
                            this.showMenu();
                        };
                    }

                    grid.appendChild(card);
                });
            },

            startGame(useCustom = false) {
                // Проверяем, есть ли свои примеры
                if (useCustom && this.customQuestions.length === 0) {
                    alert('Сначала добавьте свои примеры!');
                    return;
                }

                this.useCustomQuestions = useCustom;

                this.gameState = {
                    score: 0,
                    combo: 0,
                    maxCombo: 0,
                    correct: 0,
                    wrong: 0,
                    timeLeft: 60,
                    isPlaying: true,
                    currentQuestion: null,
                    usedQuestions: [] // Для отслеживания использованных вопросов
                };

                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.add('active');
                document.getElementById('resultScreen').classList.remove('active');
                document.getElementById('customQuestionsScreen').classList.remove('active');

                this.updateGameUI();
                this.nextQuestion();
                this.startTimer();
                this.startSpawning();
            },

            startTimer() {
                this.gameTimer = setInterval(() => {
                    this.gameState.timeLeft--;
                    const timerEl = document.getElementById('timer');
                    timerEl.textContent = this.gameState.timeLeft;

                    if (this.gameState.timeLeft <= 10) {
                        timerEl.classList.add('warning');
                    }

                    if (this.gameState.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);
            },

            updateGameUI() {
                document.getElementById('score').textContent = this.gameState.score;

                if (this.gameState.combo > 0) {
                    let comboText = `🔥 COMBO x${this.gameState.combo}`;
                    if (this.gameState.combo >= 10) comboText = `💥 NINJA x${this.gameState.combo}`;
                    else if (this.gameState.combo >= 5) comboText = `⚡ SUPER x${this.gameState.combo}`;
                    document.getElementById('comboDisplay').textContent = comboText;
                } else {
                    document.getElementById('comboDisplay').textContent = '';
                }
            },

            nextQuestion() {
                if (!this.gameState.isPlaying) return;

                if (this.useCustomQuestions) {
                    // Используем свои примеры
                    if (this.customQuestions.length === 0) {
                        this.endGame();
                        return;
                    }

                    // Если все вопросы использованы, начинаем заново
                    if (this.gameState.usedQuestions.length >= this.customQuestions.length) {
                        this.gameState.usedQuestions = [];
                    }

                    // Выбираем случайный вопрос из неиспользованных
                    let availableQuestions = this.customQuestions.filter((q, i) => !this.gameState.usedQuestions.includes(i));
                    let randomIndex = Math.floor(Math.random() * availableQuestions.length);
                    this.gameState.currentQuestion = availableQuestions[randomIndex];

                    // Запоминаем индекс использованного вопроса
                    let originalIndex = this.customQuestions.indexOf(this.gameState.currentQuestion);
                    this.gameState.usedQuestions.push(originalIndex);
                } else {
                    // Генерируем автоматически
                    this.gameState.currentQuestion = questionGenerator.generateQuestion(this.currentBelt);
                }

                document.getElementById('question').textContent = this.gameState.currentQuestion.text;
            },

            startSpawning() {
                this.spawnFruit();
                this.spawnInterval = setInterval(() => {
                    if (this.gameState.isPlaying) {
                        this.spawnFruit();
                    }
                }, 2500); // Увеличил интервал спавна
            },

            spawnFruit() {
                if (!this.gameState.currentQuestion) return;

                const option = this.gameState.currentQuestion.options[
                    Math.floor(Math.random() * this.gameState.currentQuestion.options.length)
                ];

                const fruit = document.createElement('div');
                fruit.className = 'fruit';

                const startX = Math.random() * (window.innerWidth - 120);

                fruit.style.left = startX + 'px';
                fruit.style.bottom = '-120px';

                fruit.innerHTML = `
                    <div class="fruit-bg"></div>
                    <div class="fruit-number">${option}</div>
                `;

                fruit.dataset.value = option;
                fruit.dataset.correct = (option === this.gameState.currentQuestion.correct) ? 'true' : 'false';

                fruit.addEventListener('click', (e) => this.slashFruit(fruit, e));
                fruit.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.slashFruit(fruit, e.touches[0]);
                });

                document.getElementById('gameArea').appendChild(fruit);

                // Медленная анимация вылета вверх и залета обратно вниз
                const duration = 4500; // Увеличил длительность анимации
                const maxHeight = window.innerHeight * 0.7; // Максимальная высота подъёма
                const horizontalMove = (Math.random() - 0.5) * 150;

                const startTime = Date.now();
                const animate = () => {
                    if (!this.gameState.isPlaying || fruit.classList.contains('slashed')) {
                        if (!fruit.classList.contains('slashed')) {
                            fruit.remove();
                        }
                        return;
                    }

                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Параболическая траектория (вверх и обратно вниз)
                    const parabola = -4 * progress * (progress - 1); // Парабола от 0 до 1 и обратно к 0
                    const y = -maxHeight * parabola;
                    const x = horizontalMove * progress;
                    const rotation = progress * 720; // Два полных оборота

                    fruit.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        // Фрукт вернулся вниз - удаляем
                        fruit.remove();
                    }
                };

                requestAnimationFrame(animate);
            },

            slashFruit(fruit, event) {
                if (fruit.classList.contains('slashed')) return;

                fruit.classList.add('slashed');

                const value = parseInt(fruit.dataset.value);
                const isCorrect = fruit.dataset.correct === 'true';

                if (isCorrect) {
                    this.gameState.combo++;
                    if (this.gameState.combo > this.gameState.maxCombo) {
                        this.gameState.maxCombo = this.gameState.combo;
                    }

                    let points = 10;
                    if (this.gameState.combo >= 10) points = 50;
                    else if (this.gameState.combo >= 5) points = 30;
                    else if (this.gameState.combo >= 3) points = 20;

                    this.gameState.score += points;
                    this.gameState.correct++;

                    this.showScorePopup(`+${points}`, event.clientX, event.clientY, true);
                    this.showSlashEffect(event.clientX, event.clientY);
                    this.createParticles(event.clientX, event.clientY, '#4CAF50');

                    setTimeout(() => this.nextQuestion(), 300);
                } else {
                    this.gameState.score = Math.max(0, this.gameState.score - 5);
                    this.gameState.wrong++;
                    this.gameState.combo = 0;

                    this.showScorePopup('-5', event.clientX, event.clientY, false);
                    this.createParticles(event.clientX, event.clientY, '#FF6B6B');
                }

                this.updateGameUI();

                setTimeout(() => {
                    if (fruit.parentNode) {
                        fruit.remove();
                    }
                }, 500);
            },

            showSlashEffect(x, y) {
                const slash = document.createElement('div');
                slash.className = 'slash-effect';
                slash.textContent = '⚔️';
                slash.style.left = x + 'px';
                slash.style.top = y + 'px';
                document.body.appendChild(slash);

                setTimeout(() => slash.remove(), 600);
            },

            showScorePopup(text, x, y, isPositive) {
                const popup = document.createElement('div');
                popup.className = 'score-popup ' + (isPositive ? 'plus' : 'minus');
                popup.textContent = text;
                popup.style.left = x + 'px';
                popup.style.top = y + 'px';
                document.body.appendChild(popup);

                setTimeout(() => popup.remove(), 1000);
            },

            createParticles(x, y, color) {
                for (let i = 0; i < 8; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.textContent = '✨';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.color = color;
                    particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                    particle.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
                    particle.style.animation = `particleFloat ${0.8 + Math.random() * 0.4}s ease-out forwards`;
                    document.body.appendChild(particle);

                    setTimeout(() => particle.remove(), 1200);
                }
            },

            endGame() {
                this.gameState.isPlaying = false;
                clearInterval(this.gameTimer);
                clearInterval(this.spawnInterval);

                document.getElementById('gameArea').innerHTML = '';

                // XP и прогрессия
                const xpGain = this.gameState.correct * 10;
                this.playerData.xp += xpGain;

                let isNewRecord = false;
                if (this.gameState.score > this.playerData.bestScore) {
                    this.playerData.bestScore = this.gameState.score;
                    isNewRecord = true;
                }
                if (this.gameState.maxCombo > this.playerData.bestCombo) {
                    this.playerData.bestCombo = this.gameState.maxCombo;
                }

                const nextLevelXP = this.playerData.level * 100;
                if (this.playerData.xp >= nextLevelXP) {
                    this.playerData.xp -= nextLevelXP;
                    this.playerData.level++;
                }

                if (this.playerData.xp >= this.belts[1].xpRequired && this.playerData.belt < 1) {
                    this.playerData.belt = 1;
                }
                if (this.playerData.xp >= this.belts[2].xpRequired && this.playerData.belt < 2) {
                    this.playerData.belt = 2;
                }

                storageManager.save(this.playerData);
                this.updatePlayerInfo();

                document.getElementById('finalScore').textContent = this.gameState.score;
                document.getElementById('finalCorrect').textContent = this.gameState.correct;
                document.getElementById('finalWrong').textContent = this.gameState.wrong;
                document.getElementById('finalCombo').textContent = this.gameState.maxCombo;

                if (isNewRecord) {
                    document.getElementById('newRecord').style.display = 'block';
                } else {
                    document.getElementById('newRecord').style.display = 'none';
                }

                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('resultScreen').classList.add('active');
            },

            createSakura() {
                for (let i = 0; i < 15; i++) {
                    setTimeout(() => {
                        const sakura = document.createElement('div');
                        sakura.className = 'sakura';
                        sakura.style.left = Math.random() * 100 + '%';
                        sakura.style.animationDuration = (Math.random() * 3 + 5) + 's';
                        sakura.style.animationDelay = Math.random() * 5 + 's';
                        document.body.appendChild(sakura);
                    }, i * 200);
                }
            }
        };

        // =====================
        // ИНИЦИАЛИЗАЦИЯ
        // =====================
        document.addEventListener('DOMContentLoaded', () => {
            gameManager.init();
        });

        // Предотвращение скролла
        document.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });
    </script>
</body>
