<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математическое королевство - Полная версия</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #4A90E2 50%, #1E3A8A 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* ЗАГОЛОВОК */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 3em;
            color: #fff;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4);
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4); }
            50% { text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 215, 0, 0.8); }
        }

        .subtitle {
            font-size: 1.8em;
            color: #FFD700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-top: 10px;
        }

        /* СТАТИСТИКА */
        .stats-panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 3px solid #FFD700;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .stat-label {
            font-size: 1em;
            color: #666;
        }

        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #333;
        }

        .combo-badge {
            background: linear-gradient(135deg, #FF6B6B, #FFA500);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1.5em;
            font-weight: bold;
            animation: comboPulse 1s infinite;
        }

        @keyframes comboPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ГЛАВНАЯ СЕТКА */
        .main-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(100, 200, 255, 0.5);
        }

        .panel-title {
            font-size: 1.8em;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }

        /* ОСТРОВ */
        .island-container {
            position: relative;
            background: radial-gradient(circle, #1E90FF, #0066CC);
            border-radius: 20px;
            padding: 30px;
            min-height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .island {
            position: relative;
            background: radial-gradient(circle, #8FBC8F 0%, #3CB371 50%, #228B22 100%);
            border-radius: 50%;
            width: 90%;
            max-width: 700px;
            aspect-ratio: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            padding: 50px;
            gap: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border: 6px solid #D2B48C;
        }

        .building-slot {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px dashed rgba(139, 69, 19, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .building-slot:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }

        .building-slot.built {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #8B4513;
            animation: buildPop 0.5s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        @keyframes buildPop {
            0% { transform: scale(0) rotate(-180deg); }
            60% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .building-income {
            position: absolute;
            bottom: -8px;
            right: -8px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.4em;
            font-weight: bold;
            border: 2px solid white;
        }

        /* ПЕРСОНАЖ */
        .character {
            position: absolute;
            bottom: 40px;
            font-size: 3.5em;
            animation: walk 5s ease-in-out infinite;
            filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.5));
        }

        @keyframes walk {
            0%, 100% { transform: translateX(-120px); }
            50% { transform: translateX(120px) scaleX(-1); }
        }

        /* ПИТОМЕЦ */
        .pet-card {
            position: absolute;
            top: 15px;
            right: 15px;
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
            border: 3px solid #FFD700;
        }

        .pet-icon {
            font-size: 3.5em;
        }

        .pet-name {
            font-weight: bold;
            color: #333;
            margin: 5px 0;
        }

        .pet-xp-bar {
            background: #e0e0e0;
            height: 10px;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 5px;
        }

        .pet-xp-fill {
            background: linear-gradient(90deg, #FF6B6B, #FFA500);
            height: 100%;
            transition: width 0.5s ease;
        }

        /* РЕГИОН БЕЙДЖ */
        .region-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 1.3em;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        /* КНОПКИ ДЕЙСТВИЙ */
        .action-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.6em;
            border-radius: 15px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.5);
        }

        .action-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .action-btn.success {
            background: linear-gradient(135deg, #11998e, #38ef7d);
        }

        /* СОБЫТИЯ */
        .event-panel {
            background: linear-gradient(135deg, #FFE5B4, #FFDAB9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #FF6B6B;
            box-shadow: 0 0 30px rgba(255, 107, 107, 0.5);
            animation: eventGlow 2s ease-in-out infinite;
        }

        @keyframes eventGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(255, 107, 107, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 107, 107, 0.8); }
        }

        .event-title {
            font-size: 1.8em;
            color: #FF6B6B;
            margin-bottom: 10px;
            font-weight: bold;
            text-align: center;
        }

        .event-desc {
            font-size: 1.2em;
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .event-progress {
            font-size: 1.3em;
            color: #4CAF50;
            font-weight: bold;
            text-align: center;
        }

        /* БИТВА С ДРАКОНОМ */
        .dragon-battle {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            border: 3px solid #e74c3c;
        }

        .dragon-hp-bar {
            background: #34495e;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 15px 0;
            border: 2px solid #e74c3c;
        }

        .dragon-hp-fill {
            background: linear-gradient(90deg, #e74c3c, #c0392b);
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .dragon-icon {
            font-size: 5em;
            text-align: center;
            animation: dragonShake 0.5s ease-in-out infinite;
        }

        @keyframes dragonShake {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        /* ВОПРОС */
        .question-box {
            background: linear-gradient(135deg, #FFF9E6, #FFF4CC);
            border-radius: 15px;
            padding: 20px;
            display: none;
            border: 3px solid #FFD700;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .question-box.active {
            display: block;
            animation: questionPop 0.3s ease;
        }

        @keyframes questionPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .question-text {
            font-size: 2.2em;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .answer-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.6em;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .answer-btn:hover {
            transform: scale(1.05);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            animation: correct 0.5s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(135deg, #eb3349, #f45c43);
            animation: shake 0.5s ease;
        }

        @keyframes correct {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* МАГАЗИН */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
            max-height: 500px;
            overflow-y: auto;
            padding: 10px;
        }

        .shop-item {
            background: linear-gradient(135deg, #FFE5B4, #FFDAB9);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
        }

        .shop-item:hover {
            transform: translateY(-5px);
            border-color: #667eea;
        }

        .shop-item.affordable {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .shop-item.locked {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .shop-icon {
            font-size: 2.5em;
        }

        .shop-name {
            font-size: 1em;
            font-weight: bold;
            color: #333;
            margin: 5px 0;
        }

        .shop-cost {
            font-size: 1em;
            color: #FF6B6B;
            font-weight: bold;
        }

        .shop-income {
            font-size: 0.9em;
            color: #4CAF50;
            margin-top: 3px;
        }

        /* КОРОЛЕВСКАЯ ЛИГА */
        .leaderboard {
            max-height: 400px;
            overflow-y: auto;
        }

        .leaderboard-item {
            background: linear-gradient(135deg, #FFE5B4, #FFDAB9);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 2px solid transparent;
        }

        .leaderboard-item.player {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.5);
        }

        .leaderboard-rank {
            font-size: 2em;
            font-weight: bold;
            color: #FF6B6B;
            min-width: 50px;
        }

        .leaderboard-info {
            flex: 1;
        }

        .leaderboard-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .leaderboard-score {
            font-size: 1em;
            color: #666;
        }

        /* МОДАЛЬНОЕ ОКНО */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 5px solid #FFD700;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2em;
            cursor: pointer;
            color: #999;
        }

        .modal-title {
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }

        /* УВЕДОМЛЕНИЯ */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 1001;
            max-width: 500px;
            border: 5px solid #FFD700;
        }

        .notification.show {
            animation: notifShow 0.5s ease forwards;
        }

        @keyframes notifShow {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
            70% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        .notification-title {
            font-size: 2.5em;
            margin-bottom: 15px;
        }

        .notification-text {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 20px;
        }

        .notification-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.3em;
            border-radius: 12px;
            cursor: pointer;
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .building-slot {
                width: 70px;
                height: 70px;
                font-size: 2.5em;
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2em;
            }

            .building-slot {
                width: 60px;
                height: 60px;
                font-size: 2em;
            }

            .island {
                padding: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ЗАГОЛОВОК -->
        <div class="header">
            <h1 class="title">👑 МАТЕМАТИЧЕСКОЕ КОРОЛЕВСТВО 👑</h1>
            <div class="subtitle" id="regionTitle">Деревня</div>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stats-panel">
            <div class="stat-item">
                <div class="stat-label">Монеты</div>
                <div class="stat-value">🪙 <span id="coins">20</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Уровень</div>
                <div class="stat-value">⭐ <span id="level">1</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Население</div>
                <div class="stat-value">👥 <span id="population">1</span></div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Доход/мин</div>
                <div class="stat-value">💰 <span id="income">0</span></div>
            </div>
            <div class="stat-item" id="comboItem" style="display: none;">
                <div class="combo-badge">
                    🔥 Серия: <span id="combo">0</span>
                </div>
            </div>
        </div>

        <!-- ГЛАВНАЯ СЕТКА -->
        <div class="main-grid">
            <!-- ОСТРОВ -->
            <div class="panel">
                <div class="region-badge" id="regionBadge">📍 Регион 1</div>

                <div class="pet-card">
                    <div class="pet-icon" id="petIcon">🐶</div>
                    <div class="pet-name">Ур. <span id="petLevel">1</span></div>
                    <div class="pet-xp-bar">
                        <div class="pet-xp-fill" id="petXpFill" style="width: 0%"></div>
                    </div>
                </div>

                <div class="island-container">
                    <div class="island" id="kingdomGrid"></div>
                    <div class="character">🧑‍🌾</div>
                </div>
            </div>

            <!-- ДЕЙСТВИЯ -->
            <div class="panel">
                <h2 class="panel-title">⚔️ Действия</h2>

                <!-- СОБЫТИЯ -->
                <div id="eventContainer"></div>

                <!-- БИТВА С ДРАКОНОМ -->
                <div id="dragonBattle" style="display: none;"></div>

                <!-- КНОПКИ -->
                <button class="action-btn" onclick="earnCoins()">
                    ⚔️ Заработать монеты
                </button>

                <button class="action-btn secondary" onclick="showShop()">
                    🏗️ Строить
                </button>

                <button class="action-btn success" onclick="collectIncome()">
                    💰 Собрать доход
                </button>

                <button class="action-btn secondary" onclick="showLeaderboard()">
                    🏆 Королевская лига
                </button>

                <!-- ВОПРОС -->
                <div class="question-box" id="questionBox">
                    <div class="question-text" id="questionText"></div>
                    <div class="answers-grid" id="answersGrid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО МАГАЗИНА -->
    <div class="modal" id="shopModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('shopModal')">×</span>
            <h2 class="modal-title">🏗️ Магазин зданий</h2>
            <div class="shop-grid" id="shopGrid"></div>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ЛИГИ -->
    <div class="modal" id="leaderboardModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal('leaderboardModal')">×</span>
            <h2 class="modal-title">🏆 Королевская лига</h2>
            <div class="leaderboard" id="leaderboardList"></div>
        </div>
    </div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div class="notification" id="notification">
        <div class="notification-title" id="notificationTitle"></div>
        <div class="notification-text" id="notificationText"></div>
        <button class="notification-btn" onclick="closeNotification()">Отлично!</button>
    </div>

    <script>
        // ДАННЫЕ ИГРЫ
        let gameData = {
            coins: 20,
            level: 1,
            xp: 0,
            population: 1,
            region: 1,
            buildings: ['house'],
            combo: 0,
            maxCombo: 0,
            totalCorrect: 0,
            totalWrong: 0,
            pet: { type: 'dog', level: 1, xp: 0 },
            passiveIncome: 0,
            lastIncomeTime: Date.now(),
            totalScore: 0, // Для лиги
            avgSpeed: 0
        };

        // СОБЫТИЯ
        let currentEvent = null;
        let eventProgress = 0;
        let dragonHP = 0;
        let maxDragonHP = 0;

        // ТИПЫ ЗДАНИЙ (РАСШИРЕННЫЕ)
        const buildings = {
            // ЭКОНОМИКА
            house: { icon: '🏠', name: 'Дом', cost: 30, income: 1, region: 1 },
            farm: { icon: '🌾', name: 'Ферма', cost: 50, income: 2, region: 1 },
            mill: { icon: '🏭', name: 'Мельница', cost: 100, income: 3, region: 1 },
            bakery: { icon: '🥖', name: 'Пекарня', cost: 120, income: 4, region: 2 },
            shop: { icon: '🏪', name: 'Магазин', cost: 150, income: 5, region: 2 },
            tavern: { icon: '🍺', name: 'Таверна', cost: 180, income: 6, region: 2 },
            mine: { icon: '⛏️', name: 'Шахта', cost: 300, income: 8, region: 2 },
            forge: { icon: '⚒️', name: 'Кузница', cost: 350, income: 10, region: 3 },
            workshop: { icon: '🔨', name: 'Мастерская', cost: 500, income: 12, region: 3 },
            market: { icon: '🏛️', name: 'Рынок', cost: 600, income: 15, region: 3 },

            // НАСЕЛЕНИЕ
            village: { icon: '🏘️', name: 'Деревня', cost: 200, population: 5, region: 2 },
            school: { icon: '🏫', name: 'Школа', cost: 400, population: 10, region: 3 },
            hospital: { icon: '🏥', name: 'Больница', cost: 600, population: 15, region: 3 },
            university: { icon: '🎓', name: 'Университет', cost: 800, population: 20, region: 4 },

            // КОРОЛЕВСКИЕ
            castle: { icon: '🏰', name: 'Замок', cost: 1000, income: 20, region: 3 },
            palace: { icon: '🏛️', name: 'Дворец', cost: 2000, income: 40, region: 4 },
            tower: { icon: '🗼', name: 'Башня', cost: 1500, income: 30, region: 4 },
            cathedral: { icon: '⛪', name: 'Собор', cost: 1200, income: 25, region: 3 },

            // ДЕКОР
            tree: { icon: '🌳', name: 'Дерево', cost: 20, region: 1 },
            fountain: { icon: '⛲', name: 'Фонтан', cost: 80, region: 2 },
            statue: { icon: '🗿', name: 'Статуя', cost: 150, region: 3 },
            flowers: { icon: '🌷', name: 'Цветы', cost: 30, region: 1 },
            lamp: { icon: '💡', name: 'Фонарь', cost: 50, region: 2 },
            bench: { icon: '🪑', name: 'Скамейка', cost: 40, region: 1 }
        };

        // СОБЫТИЯ
        const events = {
            dragon: {
                title: '🐉 Дракон атакует!',
                desc: 'Дракон угрожает королевству!',
                hp: 5,
                reward: 200,
                type: 'battle'
            },
            festival: {
                title: '🎪 Королевский праздник!',
                desc: 'Реши 3 задачи и получи награду!',
                tasks: 3,
                reward: 100,
                type: 'tasks'
            },
            bandits: {
                title: '👹 Нашествие разбойников!',
                desc: 'Защити королевство решив 4 задачи!',
                tasks: 4,
                reward: 150,
                type: 'tasks'
            },
            flood: {
                title: '🌊 Наводнение!',
                desc: 'Построй дамбу решив 5 задач!',
                tasks: 5,
                reward: 180,
                type: 'tasks'
            }
        };

        // ИНИЦИАЛИЗАЦИЯ
        function init() {
            loadGame();
            updateUI();
            renderKingdom();
            startPassiveIncome();
            checkRandomEvent();
        }

        function loadGame() {
            const saved = localStorage.getItem('mathKingdomFull');
            if (saved) {
                gameData = { ...gameData, ...JSON.parse(saved) };
            }
        }

        function saveGame() {
            localStorage.setItem('mathKingdomFull', JSON.stringify(gameData));
        }

        function updateUI() {
            document.getElementById('coins').textContent = Math.floor(gameData.coins);
            document.getElementById('level').textContent = gameData.level;
            document.getElementById('population').textContent = gameData.population;
            document.getElementById('income').textContent = gameData.passiveIncome;

            // Комбо
            if (gameData.combo > 0) {
                document.getElementById('comboItem').style.display = 'block';
                document.getElementById('combo').textContent = gameData.combo;
            } else {
                document.getElementById('comboItem').style.display = 'none';
            }

            // Регион
            const regionNames = ['Деревня', 'Город', 'Королевство', 'Империя'];
            document.getElementById('regionTitle').textContent = regionNames[gameData.region - 1];
            document.getElementById('regionBadge').textContent = `📍 Регион ${gameData.region}`;

            // Питомец
            const petIcons = { dog: '🐶', cat: '🐱', dragon: '🐉', fox: '🦊' };
            document.getElementById('petIcon').textContent = petIcons[gameData.pet.type];
            document.getElementById('petLevel').textContent = gameData.pet.level;

            const petXpNeeded = gameData.pet.level * 50;
            const petXpPercent = (gameData.pet.xp / petXpNeeded) * 100;
            document.getElementById('petXpFill').style.width = petXpPercent + '%';

            calculatePassiveIncome();
        }

        function renderKingdom() {
            const grid = document.getElementById('kingdomGrid');
            grid.innerHTML = '';

            const maxSlots = 30; // Еще больше слотов

            for (let i = 0; i < maxSlots; i++) {
                const slot = document.createElement('div');
                slot.className = 'building-slot';

                if (i < gameData.buildings.length) {
                    const buildingId = gameData.buildings[i];
                    const building = buildings[buildingId];
                    if (building) {
                        slot.className = 'building-slot built';
                        slot.textContent = building.icon;
                        slot.title = building.name;

                        if (building.income) {
                            const income = document.createElement('div');
                            income.className = 'building-income';
                            income.textContent = `+${building.income}`;
                            slot.appendChild(income);
                        }
                    }
                }

                grid.appendChild(slot);
            }
        }

        function calculatePassiveIncome() {
            let income = 0;
            let pop = 1;

            gameData.buildings.forEach(id => {
                const building = buildings[id];
                if (building) {
                    if (building.income) income += building.income;
                    if (building.population) pop += building.population;
                }
            });

            gameData.passiveIncome = income;
            gameData.population = pop;
        }

        function startPassiveIncome() {
            setInterval(() => {
                if (gameData.passiveIncome > 0) {
                    const income = gameData.passiveIncome / 60;
                    gameData.coins += income;
                    updateUI();
                    saveGame();
                }
            }, 1000);
        }

        function collectIncome() {
            if (gameData.passiveIncome === 0) {
                showNotif('💰 Нет дохода', 'Построй здания с доходом!');
                return;
            }

            const income = gameData.passiveIncome * 5;
            gameData.coins += income;
            updateUI();
            saveGame();
            showNotif('💰 Собрано!', `+${Math.floor(income)} монет!`);
        }

        // ЗАРАБОТАТЬ МОНЕТЫ
        function earnCoins() {
            if (dragonHP > 0) {
                // Во время битвы с драконом
                askQuestion('dragon');
            } else if (currentEvent && currentEvent.type === 'tasks') {
                askQuestion('event');
            } else {
                askQuestion('normal');
            }
        }

        function askQuestion(context) {
            const q = generateQuestion();
            document.getElementById('questionText').textContent = q.text;
            document.getElementById('questionBox').classList.add('active');

            const grid = document.getElementById('answersGrid');
            grid.innerHTML = '';

            q.answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans;
                btn.onclick = () => checkAnswer(ans, q.correct, context);
                grid.appendChild(btn);
            });
        }

        function generateQuestion() {
            const difficulty = gameData.region;
            let a, b, op, answer;

            if (difficulty === 1) {
                a = Math.floor(Math.random() * 10) + 1;
                b = Math.floor(Math.random() * 10) + 1;
                op = Math.random() > 0.5 ? '+' : '-';
                if (op === '-' && a < b) [a, b] = [b, a];
                answer = op === '+' ? a + b : a - b;
            } else if (difficulty === 2) {
                a = Math.floor(Math.random() * 50) + 1;
                b = Math.floor(Math.random() * 50) + 1;
                op = ['+', '-', '×'][Math.floor(Math.random() * 3)];
                if (op === '-' && a < b) [a, b] = [b, a];
                if (op === '×') {
                    a = Math.floor(Math.random() * 9) + 2;
                    b = Math.floor(Math.random() * 9) + 2;
                }
                answer = op === '+' ? a + b : op === '-' ? a - b : a * b;
            } else {
                a = Math.floor(Math.random() * 100) + 1;
                b = Math.floor(Math.random() * 50) + 1;
                op = ['+', '-', '×', '÷'][Math.floor(Math.random() * 4)];
                if (op === '÷') {
                    b = Math.floor(Math.random() * 9) + 2;
                    answer = Math.floor(Math.random() * 12) + 1;
                    a = b * answer;
                } else if (op === '-' && a < b) {
                    [a, b] = [b, a];
                } else if (op === '×') {
                    a = Math.floor(Math.random() * 12) + 2;
                    b = Math.floor(Math.random() * 12) + 2;
                }
                if (op !== '÷') {
                    answer = op === '+' ? a + b : op === '-' ? a - b : a * b;
                }
            }

            const text = `${a} ${op} ${b} = ?`;
            const wrong = [answer + 1, answer - 1, answer + 2, answer - 2].filter(x => x > 0);
            const answers = [answer, ...wrong.slice(0, 3)].sort(() => Math.random() - 0.5);

            return { text, correct: answer, answers };
        }

        function checkAnswer(answer, correct, context) {
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach(btn => {
                btn.onclick = null;
                if (parseInt(btn.textContent) === correct) {
                    btn.classList.add('correct');
                } else if (parseInt(btn.textContent) === answer) {
                    btn.classList.add('wrong');
                }
            });

            if (answer === correct) {
                gameData.combo++;
                gameData.totalCorrect++;
                if (gameData.combo > gameData.maxCombo) gameData.maxCombo = gameData.combo;

                let reward = 10 * gameData.region;
                let xp = 5;

                // Бонус за комбо
                if (gameData.combo >= 10) {
                    reward *= 5;
                    xp *= 5;
                } else if (gameData.combo >= 5) {
                    reward *= 3;
                    xp *= 3;
                } else if (gameData.combo >= 3) {
                    reward = Math.floor(reward * 1.5);
                    xp = Math.floor(xp * 1.5);
                }

                gameData.coins += reward;
                gameData.xp += xp;
                gameData.pet.xp += xp;
                gameData.totalScore += reward;

                // Уровень
                const xpNeeded = gameData.level * 100;
                if (gameData.xp >= xpNeeded) {
                    gameData.xp -= xpNeeded;
                    gameData.level++;
                    checkRegion();
                    showNotif('🎉 Новый уровень!', `Ты достиг ${gameData.level} уровня!`);
                }

                // Уровень питомца
                const petXpNeeded = gameData.pet.level * 50;
                if (gameData.pet.xp >= petXpNeeded) {
                    gameData.pet.xp -= petXpNeeded;
                    gameData.pet.level++;
                    showNotif('🐶 Питомец вырос!', `Уровень ${gameData.pet.level}!`);
                }

                // Контекст
                if (context === 'dragon') {
                    dragonHP--;
                    if (dragonHP <= 0) {
                        completeDragonBattle();
                    } else {
                        updateDragonBattle();
                    }
                } else if (context === 'event') {
                    eventProgress++;
                    if (eventProgress >= currentEvent.tasks) {
                        completeEvent();
                    } else {
                        updateEvent();
                    }
                }

                updateUI();
                saveGame();
            } else {
                gameData.combo = 0;
                gameData.totalWrong++;
                updateUI();
            }

            setTimeout(() => {
                document.getElementById('questionBox').classList.remove('active');
            }, 1500);
        }

        function checkRegion() {
            if (gameData.level >= 20 && gameData.region < 4) {
                gameData.region = 4;
                showNotif('🏛️ Новый регион!', 'Империя открыта!');
            } else if (gameData.level >= 10 && gameData.region < 3) {
                gameData.region = 3;
                showNotif('🏰 Новый регион!', 'Королевство открыто!');
            } else if (gameData.level >= 5 && gameData.region < 2) {
                gameData.region = 2;
                showNotif('🏙️ Новый регион!', 'Город открыт!');
            }
        }

        // СОБЫТИЯ
        function checkRandomEvent() {
            setInterval(() => {
                if (!currentEvent && Math.random() < 0.2) {
                    const eventKeys = Object.keys(events);
                    const eventKey = eventKeys[Math.floor(Math.random() * eventKeys.length)];
                    startEvent(eventKey);
                }
            }, 60000); // Каждую минуту
        }

        function startEvent(eventKey) {
            const event = events[eventKey];
            currentEvent = { ...event, key: eventKey };
            eventProgress = 0;

            if (event.type === 'battle') {
                dragonHP = event.hp;
                maxDragonHP = event.hp;
                updateDragonBattle();
            } else {
                updateEvent();
            }
        }

        function updateEvent() {
            const container = document.getElementById('eventContainer');
            container.innerHTML = `
                <div class="event-panel">
                    <div class="event-title">${currentEvent.title}</div>
                    <div class="event-desc">${currentEvent.desc}</div>
                    <div class="event-progress">Прогресс: ${eventProgress}/${currentEvent.tasks}</div>
                    <div class="event-progress">Награда: ${currentEvent.reward} 🪙</div>
                </div>
            `;
        }

        function completeEvent() {
            gameData.coins += currentEvent.reward;
            showNotif(`${currentEvent.title} Победа!`, `+${currentEvent.reward} монет!`);
            currentEvent = null;
            eventProgress = 0;
            document.getElementById('eventContainer').innerHTML = '';
            updateUI();
            saveGame();
        }

        function updateDragonBattle() {
            const container = document.getElementById('dragonBattle');
            container.style.display = 'block';

            const hpPercent = (dragonHP / maxDragonHP) * 100;

            container.innerHTML = `
                <div class="dragon-battle">
                    <div class="dragon-icon">🐉</div>
                    <div class="dragon-hp-bar">
                        <div class="dragon-hp-fill" style="width: ${hpPercent}%">
                            ${dragonHP} / ${maxDragonHP} HP
                        </div>
                    </div>
                    <div style="text-align: center; color: white; font-size: 1.2em;">
                        Реши примеры чтобы победить!
                    </div>
                </div>
            `;
        }

        function completeDragonBattle() {
            gameData.coins += currentEvent.reward;
            showNotif('🐉 Дракон побежден!', `+${currentEvent.reward} монет!`);
            currentEvent = null;
            dragonHP = 0;
            document.getElementById('dragonBattle').style.display = 'none';
            updateUI();
            saveGame();
        }

        // МАГАЗИН
        function showShop() {
            const grid = document.getElementById('shopGrid');
            grid.innerHTML = '';

            Object.entries(buildings).forEach(([id, building]) => {
                const canBuild = gameData.region >= building.region;
                const canAfford = gameData.coins >= building.cost;
                const hasSpace = gameData.buildings.length < 30;

                const item = document.createElement('div');
                item.className = 'shop-item';

                if (!canBuild) {
                    item.classList.add('locked');
                } else if (canAfford && hasSpace) {
                    item.classList.add('affordable');
                }

                item.innerHTML = `
                    <div class="shop-icon">${building.icon}</div>
                    <div class="shop-name">${building.name}</div>
                    <div class="shop-cost">🪙 ${building.cost}</div>
                    ${building.income ? `<div class="shop-income">+${building.income}/мин</div>` : ''}
                    ${building.population ? `<div class="shop-income">+${building.population} 👥</div>` : ''}
                    ${!canBuild ? `<div style="color: #999; font-size: 0.85em;">Рег. ${building.region}</div>` : ''}
                `;

                if (canBuild && hasSpace) {
                    item.onclick = () => buyBuilding(id, building);
                }

                grid.appendChild(item);
            });

            document.getElementById('shopModal').classList.add('show');
        }

        function buyBuilding(id, building) {
            if (gameData.coins < building.cost) {
                showNotif('❌ Недостаточно монет', `Нужно ${building.cost - gameData.coins} монет`);
                return;
            }

            if (gameData.buildings.length >= 30) {
                showNotif('🏝️ Остров заполнен', 'Нет места!');
                return;
            }

            gameData.coins -= building.cost;
            gameData.buildings.push(id);

            saveGame();
            updateUI();
            renderKingdom();
            closeModal('shopModal');
            showNotif('🎉 Построено!', `${building.icon} ${building.name}!`);
        }

        // КОРОЛЕВСКАЯ ЛИГА
        function showLeaderboard() {
            const list = document.getElementById('leaderboardList');
            list.innerHTML = '';

            // Генерация NPC
            const npcNames = ['Александр', 'Мария', 'Дмитрий', 'Анна', 'Иван', 'Елена', 'Сергей', 'Ольга'];
            const leaderboard = npcNames.map(name => ({
                name,
                score: Math.floor(Math.random() * 3000) + 500
            }));

            // Добавить игрока
            leaderboard.push({ name: 'Ты', score: gameData.totalScore, player: true });

            // Сортировка
            leaderboard.sort((a, b) => b.score - a.score);

            leaderboard.forEach((entry, index) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item' + (entry.player ? ' player' : '');

                let medal = '';
                if (index === 0) medal = '🥇';
                else if (index === 1) medal = '🥈';
                else if (index === 2) medal = '🥉';

                item.innerHTML = `
                    <div class="leaderboard-rank">${medal} ${index + 1}</div>
                    <div class="leaderboard-info">
                        <div class="leaderboard-name">${entry.name}</div>
                        <div class="leaderboard-score">${entry.score} очков</div>
                    </div>
                `;

                list.appendChild(item);
            });

            document.getElementById('leaderboardModal').classList.add('show');
        }

        // МОДАЛЬНЫЕ ОКНА
        function closeModal(id) {
            document.getElementById(id).classList.remove('show');
        }

        // УВЕДОМЛЕНИЯ
        function showNotif(title, text) {
            document.getElementById('notificationTitle').textContent = title;
            document.getElementById('notificationText').textContent = text;
            document.getElementById('notification').classList.add('show');
        }

        function closeNotification() {
            document.getElementById('notification').classList.remove('show');
        }

        // ЗАПУСК
        init();
    </script>
</body>
</html>
