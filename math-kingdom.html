<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Математическое королевство</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
            background: linear-gradient(180deg, #87CEEB 0%, #4A90E2 50%, #1E3A8A 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ОБЛАКА */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 200px;
            pointer-events: none;
            z-index: 1;
        }

        .cloud {
            position: absolute;
            background: white;
            border-radius: 100px;
            opacity: 0.8;
            animation: float 60s infinite linear;
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: white;
            border-radius: 100px;
        }

        .cloud1 {
            width: 100px;
            height: 40px;
            top: 30px;
            left: -100px;
        }

        .cloud1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud1::after {
            width: 60px;
            height: 40px;
            top: -15px;
            right: 10px;
        }

        .cloud2 {
            width: 120px;
            height: 50px;
            top: 80px;
            left: -150px;
            animation-delay: 20s;
        }

        .cloud2::before {
            width: 60px;
            height: 60px;
            top: -30px;
            left: 15px;
        }

        .cloud2::after {
            width: 70px;
            height: 50px;
            top: -20px;
            right: 15px;
        }

        .cloud3 {
            width: 90px;
            height: 35px;
            top: 120px;
            left: -200px;
            animation-delay: 40s;
        }

        .cloud3::before {
            width: 45px;
            height: 45px;
            top: -20px;
            left: 10px;
        }

        .cloud3::after {
            width: 55px;
            height: 35px;
            top: -10px;
            right: 10px;
        }

        @keyframes float {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 200px)); }
        }

        /* ВОЛНЫ */
        .waves {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            pointer-events: none;
            z-index: 1;
        }

        .wave {
            position: absolute;
            bottom: 0;
            width: 200%;
            height: 100%;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120"><path d="M0,60 Q300,0 600,60 T1200,60 L1200,120 L0,120 Z" fill="%234FC3F7" opacity="0.3"/></svg>') repeat-x;
            animation: wave 10s linear infinite;
        }

        .wave:nth-child(2) {
            animation: wave 15s linear infinite reverse;
            opacity: 0.5;
        }

        @keyframes wave {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 2;
        }

        /* ЗАГОЛОВОК */
        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        .title {
            font-size: 3.5em;
            color: #fff;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
            animation: titleGlow 3s ease-in-out infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4), 0 0 40px rgba(255, 215, 0, 0.5); }
            50% { text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.4), 0 0 60px rgba(255, 215, 0, 0.8); }
        }

        /* СТАТИСТИКА */
        .stats-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 250, 240, 0.95) 100%);
            border-radius: 25px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 -5px 15px rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 20px;
            border: 3px solid rgba(255, 215, 0, 0.5);
            position: relative;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8em;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }

        .stat-icon {
            font-size: 1.5em;
            animation: iconBounce 2s ease-in-out infinite;
        }

        @keyframes iconBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .xp-container {
            flex: 1;
            min-width: 300px;
        }

        .xp-label {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .xp-bar {
            background: linear-gradient(90deg, #e0e0e0 0%, #f0f0f0 100%);
            height: 35px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 3px solid #666;
            box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.3);
        }

        .xp-fill {
            background: linear-gradient(90deg, #FFD700 0%, #FFA500 100%);
            height: 100%;
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .xp-fill::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* КНОПКИ БЫСТРОГО ДОСТУПА */
        .quick-actions {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .quick-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #FFD700;
            border-radius: 15px;
            padding: 10px 15px;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .quick-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        .quick-btn.has-notification {
            position: relative;
            animation: pulse 2s ease infinite;
        }

        .quick-btn.has-notification::after {
            content: '!';
            position: absolute;
            top: -5px;
            right: -5px;
            background: #FF4444;
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 0.8em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ГЛАВНАЯ СЕКЦИЯ */
        .main-section {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* ОСТРОВ С КОРОЛЕВСТВОМ */
        .kingdom-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(240, 248, 255, 0.95) 100%);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(100, 200, 255, 0.5);
        }

        .panel-title {
            font-size: 2em;
            color: #2c3e50;
            margin-bottom: 15px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.8);
        }

        .island-container {
            position: relative;
            background: radial-gradient(ellipse at center, #1E90FF 0%, #0066CC 100%);
            border-radius: 20px;
            padding: 30px;
            min-height: 480px;
            overflow: hidden;
            box-shadow: inset 0 5px 20px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Остров - ИСПРАВЛЕНО */
        .island {
            position: relative;
            background: radial-gradient(ellipse at center, #8FBC8F 0%, #3CB371 50%, #228B22 100%);
            border-radius: 50%;
            width: 95%;
            max-width: 600px;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 -10px 30px rgba(0, 0, 0, 0.2);
            border: 5px solid #D2B48C;
        }

        .island::before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 20px;
            background: radial-gradient(ellipse at center, rgba(139, 69, 19, 0.6) 0%, transparent 100%);
            border-radius: 50%;
            filter: blur(8px);
        }

        /* Персонаж на острове */
        .character {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 3em;
            animation: characterWalk 4s ease-in-out infinite;
            z-index: 10;
            filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.5));
        }

        @keyframes characterWalk {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .building-slot {
            background: rgba(255, 255, 255, 0.25);
            border: 2px dashed rgba(139, 69, 19, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5em;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            backdrop-filter: blur(5px);
        }

        .building-slot:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
            border-color: rgba(139, 69, 19, 0.6);
        }

        .building-slot.built {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #8B4513;
            animation: buildingAppear 0.6s ease;
            cursor: default;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .building-slot.built:hover {
            transform: scale(1.1) translateY(-3px);
        }

        @keyframes buildingAppear {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Уровень здания */
        .building-level {
            position: absolute;
            top: -8px;
            right: -8px;
            background: linear-gradient(135deg, #FFD700, #FFA500);
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.5em;
            font-weight: bold;
            border: 2px solid white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* ПАНЕЛЬ ЗАДАНИЙ */
        .task-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 248, 240, 0.95) 100%);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            border: 3px solid rgba(255, 165, 0, 0.5);
        }

        .difficulty-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .difficulty-btn {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #666;
            border-radius: 10px;
            padding: 8px 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .difficulty-btn:hover {
            transform: translateY(-2px);
        }

        .difficulty-btn.active {
            background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%);
            color: white;
            border-color: #4CAF50;
        }

        .solve-btn {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%);
            color: white;
            border: none;
            padding: 18px 35px;
            font-size: 1.8em;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .solve-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .solve-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .solve-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(255, 107, 107, 0.5);
        }

        .solve-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .question-box {
            background: linear-gradient(135deg, #FFF9E6 0%, #FFF4CC 100%);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            display: none;
            box-shadow: inset 0 3px 10px rgba(0, 0, 0, 0.1);
            border: 3px solid #FFD700;
        }

        .question-box.active {
            display: block;
            animation: questionAppear 0.4s ease;
        }

        @keyframes questionAppear {
            0% { opacity: 0; transform: scale(0.9) translateY(-20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        .question-text {
            font-size: 2.5em;
            color: #2c3e50;
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 215, 0, 0.3);
        }

        .answers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .answer-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            font-size: 1.8em;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .answer-btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 12px 25px rgba(102, 126, 234, 0.5);
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            animation: correctPulse 0.6s ease;
        }

        .answer-btn.wrong {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            animation: shake 0.6s ease;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            25% { transform: scale(1.15) rotate(5deg); }
            50% { transform: scale(1.15) rotate(-5deg); }
            75% { transform: scale(1.15) rotate(5deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-15px); }
            40% { transform: translateX(15px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
        }

        .combo-display {
            text-align: center;
            font-size: 1.8em;
            font-weight: bold;
            min-height: 45px;
            margin-bottom: 12px;
            background: linear-gradient(90deg, #FF6B6B, #FFA500, #FFD700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(30deg); }
        }

        .reward-message {
            background: linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            font-size: 1.4em;
            font-weight: bold;
            margin-top: 12px;
            display: none;
            box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .reward-message.show {
            display: block;
            animation: rewardBurst 0.6s ease;
        }

        @keyframes rewardBurst {
            0% { opacity: 0; transform: scale(0.5) rotate(-10deg); }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }

        /* МАГАЗИН */
        .shop-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95) 0%, rgba(255, 240, 245, 0.95) 100%);
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            border: 3px solid rgba(255, 105, 180, 0.5);
        }

        .shop-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .shop-tab {
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #999;
            border-radius: 12px;
            padding: 10px 20px;
            font-size: 1.3em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .shop-tab:hover {
            transform: translateY(-2px);
        }

        .shop-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .buildings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .building-card {
            background: linear-gradient(135deg, #FFE5B4 0%, #FFDAB9 100%);
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 4px solid transparent;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .building-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transform: rotate(45deg);
            transition: all 0.5s;
        }

        .building-card:hover::before {
            left: 100%;
        }

        .building-card:hover {
            transform: translateY(-8px) scale(1.03);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border-color: #667eea;
        }

        .building-card.locked {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(0.5);
        }

        .building-card.affordable {
            border-color: #4CAF50;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.5);
            animation: affordable 2s ease infinite;
        }

        @keyframes affordable {
            0%, 100% { box-shadow: 0 0 30px rgba(76, 175, 80, 0.5); }
            50% { box-shadow: 0 0 40px rgba(76, 175, 80, 0.8); }
        }

        .building-icon {
            font-size: 3.5em;
            margin-bottom: 8px;
            filter: drop-shadow(3px 3px 6px rgba(0, 0, 0, 0.3));
        }

        .building-name {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 8px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.8);
        }

        .building-cost {
            font-size: 1.2em;
            color: #f5576c;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(255, 255, 255, 0.5);
        }

        .building-owned {
            font-size: 1em;
            color: #4CAF50;
            margin-top: 8px;
            font-weight: bold;
        }

        .upgrade-btn {
            background: linear-gradient(135deg, #FFA500 0%, #FF8C00 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 5px 10px;
            font-size: 0.9em;
            margin-top: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .upgrade-btn:hover {
            transform: scale(1.05);
        }

        /* УВЕДОМЛЕНИЯ */
        .notification {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            background: linear-gradient(135deg, #FFF 0%, #FFF9E6 100%);
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
            z-index: 1000;
            max-width: 500px;
            border: 5px solid #FFD700;
        }

        .notification.show {
            animation: notificationShow 0.5s ease forwards;
        }

        @keyframes notificationShow {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-180deg); }
            70% { transform: translate(-50%, -50%) scale(1.1) rotate(10deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        .notification-title {
            font-size: 3em;
            margin-bottom: 15px;
            animation: titleBounce 0.6s ease infinite;
        }

        @keyframes titleBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .notification-text {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .notification-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.4em;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
            transition: all 0.3s ease;
        }

        .notification-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(102, 126, 234, 0.5);
        }

        /* МОДАЛЬНОЕ ОКНО */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .modal.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .modal-content {
            background: linear-gradient(135deg, #FFF 0%, #FFF9E6 100%);
            border-radius: 25px;
            padding: 30px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 5px solid #FFD700;
            animation: modalSlide 0.4s ease;
        }

        @keyframes modalSlide {
            0% { transform: translateY(-50px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .modal-title {
            font-size: 2.5em;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 2em;
            cursor: pointer;
            color: #999;
        }

        .achievement-list {
            display: grid;
            gap: 15px;
        }

        .achievement-item {
            background: linear-gradient(135deg, #FFE5B4 0%, #FFDAB9 100%);
            border-radius: 15px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .achievement-item.completed {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.4);
        }

        .achievement-item.locked {
            opacity: 0.6;
            filter: grayscale(0.8);
        }

        .achievement-icon {
            font-size: 3em;
        }

        .achievement-info {
            flex: 1;
        }

        .achievement-name {
            font-size: 1.3em;
            font-weight: bold;
            color: #333;
        }

        .achievement-desc {
            font-size: 1em;
            color: #666;
        }

        .achievement-reward {
            font-size: 1.2em;
            color: #FFA500;
            font-weight: bold;
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 1024px) {
            .main-section {
                grid-template-columns: 1fr;
            }

            .island {
                max-width: 500px;
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5em;
            }

            .stats-panel {
                flex-direction: column;
            }

            .stat-item {
                font-size: 1.5em;
            }

            .island {
                max-width: 350px;
                padding: 20px;
                gap: 8px;
            }

            .building-slot {
                font-size: 2em;
            }

            .question-text {
                font-size: 2em;
            }

            .answers-grid {
                grid-template-columns: 1fr;
            }

            .quick-actions {
                position: static;
                justify-content: center;
                margin-top: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- ОБЛАКА -->
    <div class="clouds">
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="cloud cloud3"></div>
    </div>

    <!-- ВОЛНЫ -->
    <div class="waves">
        <div class="wave"></div>
        <div class="wave"></div>
    </div>

    <div class="container">
        <!-- ЗАГОЛОВОК -->
        <div class="header">
            <h1 class="title">🏝️ Математическое королевство 🏝️</h1>
        </div>

        <!-- СТАТИСТИКА -->
        <div class="stats-panel">
            <div class="stat-item">
                <span class="stat-icon">⭐</span>
                <span>Уровень <span id="playerLevel">1</span></span>
            </div>
            <div class="stat-item">
                <span class="stat-icon">🪙</span>
                <span id="playerCoins">0</span>
            </div>
            <div class="xp-container">
                <div class="xp-label">⚡ Опыт</div>
                <div class="xp-bar">
                    <div class="xp-fill" id="xpFill" style="width: 0%">
                        <span id="xpText">0/100</span>
                    </div>
                </div>
            </div>

            <!-- КНОПКИ БЫСТРОГО ДОСТУПА -->
            <div class="quick-actions">
                <button class="quick-btn" id="dailyBtn" onclick="showDailyReward()" title="Ежедневная награда">🎁</button>
                <button class="quick-btn" onclick="showAchievements()" title="Достижения">🏆</button>
                <button class="quick-btn" onclick="showQuests()" title="Квесты">📜</button>
            </div>
        </div>

        <!-- ГЛАВНАЯ СЕКЦИЯ -->
        <div class="main-section">
            <!-- ОСТРОВ С КОРОЛЕВСТВОМ -->
            <div class="kingdom-panel">
                <h2 class="panel-title">🏝️ Твой остров</h2>
                <div class="island-container">
                    <div class="island" id="kingdomGrid">
                        <!-- Здания будут добавляться динамически -->
                    </div>
                    <div class="character">🧑‍🌾</div>
                </div>
            </div>

            <!-- ЗАДАНИЯ -->
            <div class="task-panel">
                <h2 class="panel-title">📚 Задания</h2>

                <div class="difficulty-selector">
                    <button class="difficulty-btn active" onclick="selectDifficulty('easy')">Легко</button>
                    <button class="difficulty-btn" onclick="selectDifficulty('medium')">Средне</button>
                    <button class="difficulty-btn" onclick="selectDifficulty('hard')">Сложно</button>
                </div>

                <button class="solve-btn" id="solveBtn" onclick="startQuestion()">
                    <span style="position: relative; z-index: 1;">Решить пример</span>
                </button>

                <div class="combo-display" id="comboDisplay"></div>

                <div class="question-box" id="questionBox">
                    <div class="question-text" id="questionText">7 + 8 = ?</div>
                    <div class="answers-grid" id="answersGrid"></div>
                </div>

                <div class="reward-message" id="rewardMessage"></div>
            </div>
        </div>

        <!-- МАГАЗИН -->
        <div class="shop-panel">
            <h2 class="panel-title">🏗️ Магазин</h2>

            <div class="shop-tabs">
                <button class="shop-tab active" onclick="switchShopTab('buildings')">🏠 Здания</button>
                <button class="shop-tab" onclick="switchShopTab('upgrades')">⚡ Улучшения</button>
            </div>

            <div class="buildings-grid" id="buildingsGrid"></div>
            <div class="buildings-grid" id="upgradesGrid" style="display: none;"></div>
        </div>
    </div>

    <!-- УВЕДОМЛЕНИЕ -->
    <div class="notification" id="notification">
        <div class="notification-title" id="notificationTitle">🎉</div>
        <div class="notification-text" id="notificationText"></div>
        <button class="notification-btn" onclick="closeNotification()">Отлично!</button>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">×</span>
            <h2 class="modal-title" id="modalTitle">Достижения</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        // ДАННЫЕ ИГРОКА
        let gameData = {
            level: 1,
            xp: 0,
            coins: 0,
            combo: 0,
            totalCorrect: 0,
            totalWrong: 0,
            buildings: [],
            buildingLevels: {},
            currentQuestion: null,
            mathClass: 1,
            difficulty: 'easy',
            achievements: {},
            quests: {},
            lastDailyReward: null,
            totalBuildings: 0,
            maxCombo: 0
        };

        // ТИПЫ ЗДАНИЙ
        const buildingTypes = [
            { id: 'house', name: 'Дом', icon: '🏠', cost: 30, requiredLevel: 1 },
            { id: 'shop', name: 'Магазин', icon: '🏪', cost: 100, requiredLevel: 2 },
            { id: 'school', name: 'Школа', icon: '🏫', cost: 250, requiredLevel: 3 },
            { id: 'castle', name: 'Замок', icon: '🏰', cost: 500, requiredLevel: 4 },
            { id: 'townhall', name: 'Ратуша', icon: '🏛️', cost: 1000, requiredLevel: 5 },
            { id: 'fountain', name: 'Фонтан', icon: '⛲', cost: 150, requiredLevel: 2 },
            { id: 'park', name: 'Парк', icon: '🌳', cost: 200, requiredLevel: 3 },
            { id: 'library', name: 'Библиотека', icon: '📚', cost: 350, requiredLevel: 4 },
            { id: 'church', name: 'Церковь', icon: '⛪', cost: 400, requiredLevel: 4 },
            { id: 'windmill', name: 'Мельница', icon: '🏭', cost: 300, requiredLevel: 3 }
        ];

        // УЛУЧШЕНИЯ
        const upgradeTypes = [
            { id: 'coin_bonus', name: 'Золотая удача', icon: '💰', cost: 200, effect: 'Монет +20%', bonus: 1.2 },
            { id: 'xp_bonus', name: 'Мудрость', icon: '📖', cost: 300, effect: 'Опыта +30%', bonus: 1.3 },
            { id: 'combo_shield', name: 'Щит комбо', icon: '🛡️', cost: 500, effect: 'Комбо не сбрасывается 1 раз' },
            { id: 'auto_save', name: 'Автосохранение', icon: '💾', cost: 150, effect: 'Авто-сохранение прогресса' }
        ];

        // ДОСТИЖЕНИЯ
        const achievements = [
            { id: 'first_correct', name: 'Первый шаг', desc: 'Реши первый пример', icon: '🎯', reward: 50, check: () => gameData.totalCorrect >= 1 },
            { id: 'combo_5', name: 'В ударе!', desc: 'Набери серию из 5', icon: '🔥', reward: 100, check: () => gameData.maxCombo >= 5 },
            { id: 'combo_10', name: 'Непобедимый!', desc: 'Набери серию из 10', icon: '⚡', reward: 200, check: () => gameData.maxCombo >= 10 },
            { id: 'level_5', name: 'Опытный математик', desc: 'Достигни 5 уровня', icon: '⭐', reward: 150, check: () => gameData.level >= 5 },
            { id: 'buildings_5', name: 'Строитель', desc: 'Построй 5 зданий', icon: '🏗️', reward: 100, check: () => gameData.totalBuildings >= 5 },
            { id: 'correct_50', name: 'Знаток', desc: 'Реши 50 примеров верно', icon: '🎓', reward: 250, check: () => gameData.totalCorrect >= 50 },
            { id: 'coins_1000', name: 'Богач', desc: 'Накопи 1000 монет', icon: '💎', reward: 300, check: () => gameData.coins >= 1000 }
        ];

        // КВЕСТЫ
        const quests = [
            { id: 'daily_5', name: 'Ежедневная разминка', desc: 'Реши 5 примеров', icon: '📝', reward: 50, target: 5, progress: 0 },
            { id: 'daily_combo', name: 'Серия дня', desc: 'Набери серию из 3', icon: '🔥', reward: 75, target: 3, progress: 0 },
            { id: 'daily_building', name: 'Строительство', desc: 'Построй 1 здание', icon: '🏗️', reward: 100, target: 1, progress: 0 }
        ];

        let currentShopTab = 'buildings';

        // ИНИЦИАЛИЗАЦИЯ
        function init() {
            loadGameData();
            updateUI();
            renderKingdom();
            renderShop();
            checkDailyReward();
            checkAchievements();
        }

        // ЗАГРУЗКА ДАННЫХ
        function loadGameData() {
            const saved = localStorage.getItem('mathKingdomData');
            if (saved) {
                const savedData = JSON.parse(saved);
                gameData = { ...gameData, ...savedData };

                if (!Array.isArray(gameData.buildings)) {
                    const oldBuildings = gameData.buildings;
                    gameData.buildings = [];
                    for (const [id, count] of Object.entries(oldBuildings)) {
                        for (let i = 0; i < count; i++) {
                            gameData.buildings.push(id);
                        }
                    }
                }

                if (!gameData.buildingLevels) {
                    gameData.buildingLevels = {};
                }
                if (!gameData.achievements) {
                    gameData.achievements = {};
                }
                if (!gameData.quests) {
                    gameData.quests = {};
                }
            } else {
                gameData.buildings = ['house'];
                gameData.totalBuildings = 1;
            }
        }

        function saveGameData() {
            localStorage.setItem('mathKingdomData', JSON.stringify(gameData));
        }

        // ОБНОВЛЕНИЕ UI
        function updateUI() {
            document.getElementById('playerLevel').textContent = gameData.level;
            document.getElementById('playerCoins').textContent = gameData.coins;

            const xpNeeded = getXPForLevel(gameData.level + 1);
            const xpPercent = (gameData.xp / xpNeeded) * 100;
            document.getElementById('xpFill').style.width = xpPercent + '%';
            document.getElementById('xpText').textContent = `${gameData.xp}/${xpNeeded}`;

            if (gameData.combo > 0) {
                let comboText = '';
                if (gameData.combo >= 10) {
                    comboText = '🔥 СУПЕР СЕРИЯ x' + gameData.combo + '! 🔥';
                } else if (gameData.combo >= 5) {
                    comboText = '⚡ БОЛЬШАЯ СЕРИЯ x' + gameData.combo + '! ⚡';
                } else if (gameData.combo >= 3) {
                    comboText = '✨ Серия x' + gameData.combo + '! ✨';
                }
                document.getElementById('comboDisplay').textContent = comboText;
            } else {
                document.getElementById('comboDisplay').textContent = '';
            }

            // Обновить макс комбо
            if (gameData.combo > gameData.maxCombo) {
                gameData.maxCombo = gameData.combo;
            }
        }

        function getXPForLevel(level) {
            return level * 100;
        }

        // ВЫБОР СЛОЖНОСТИ
        function selectDifficulty(diff) {
            gameData.difficulty = diff;
            document.querySelectorAll('.difficulty-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        // ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК МАГАЗИНА
        function switchShopTab(tab) {
            currentShopTab = tab;
            document.querySelectorAll('.shop-tab').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (tab === 'buildings') {
                document.getElementById('buildingsGrid').style.display = 'grid';
                document.getElementById('upgradesGrid').style.display = 'none';
            } else {
                document.getElementById('buildingsGrid').style.display = 'none';
                document.getElementById('upgradesGrid').style.display = 'grid';
                renderUpgrades();
            }
        }

        // РЕНДЕР КОРОЛЕВСТВА (ОСТРОВА) - ИСПРАВЛЕНО: 9 ячеек
        function renderKingdom() {
            const grid = document.getElementById('kingdomGrid');
            grid.innerHTML = '';

            const maxSlots = 9; // Изменено с 16 на 9 (3x3)

            for (let i = 0; i < maxSlots; i++) {
                const slot = document.createElement('div');
                slot.className = 'building-slot';

                if (i < gameData.buildings.length) {
                    const buildingId = gameData.buildings[i];
                    const building = buildingTypes.find(b => b.id === buildingId);
                    if (building) {
                        slot.className = 'building-slot built';
                        slot.textContent = building.icon;
                        slot.title = building.name;

                        // Показать уровень здания, если есть
                        const level = gameData.buildingLevels[buildingId] || 1;
                        if (level > 1) {
                            const levelBadge = document.createElement('div');
                            levelBadge.className = 'building-level';
                            levelBadge.textContent = level;
                            slot.appendChild(levelBadge);
                        }
                    }
                }

                grid.appendChild(slot);
            }
        }

        // РЕНДЕР МАГАЗИНА
        function renderShop() {
            const grid = document.getElementById('buildingsGrid');
            grid.innerHTML = '';

            buildingTypes.forEach(building => {
                const card = document.createElement('div');
                card.className = 'building-card';

                const owned = gameData.buildings.filter(id => id === building.id).length;
                const canAfford = gameData.coins >= building.cost;
                const levelOk = gameData.level >= building.requiredLevel;
                const hasSpace = gameData.buildings.length < 9;

                if (!levelOk) {
                    card.classList.add('locked');
                } else if (canAfford && hasSpace) {
                    card.classList.add('affordable');
                }

                card.innerHTML = `
                    <div class="building-icon">${building.icon}</div>
                    <div class="building-name">${building.name}</div>
                    <div class="building-cost">🪙 ${building.cost}</div>
                    ${!levelOk ? `<div style="color: #999; margin-top: 5px; font-size: 0.9em;">Уровень ${building.requiredLevel}</div>` : ''}
                    ${!hasSpace && levelOk ? `<div style="color: #f5576c; margin-top: 5px; font-size: 0.9em;">Остров заполнен</div>` : ''}
                    ${owned > 0 ? `<div class="building-owned">Построено: ${owned}</div>` : ''}
                `;

                if (levelOk && hasSpace) {
                    card.onclick = () => buyBuilding(building);
                }

                grid.appendChild(card);
            });
        }

        // РЕНДЕР УЛУЧШЕНИЙ
        function renderUpgrades() {
            const grid = document.getElementById('upgradesGrid');
            grid.innerHTML = '';

            upgradeTypes.forEach(upgrade => {
                const card = document.createElement('div');
                card.className = 'building-card';

                const owned = gameData.achievements[upgrade.id] || false;
                const canAfford = gameData.coins >= upgrade.cost;

                if (owned) {
                    card.classList.add('locked');
                } else if (canAfford) {
                    card.classList.add('affordable');
                }

                card.innerHTML = `
                    <div class="building-icon">${upgrade.icon}</div>
                    <div class="building-name">${upgrade.name}</div>
                    <div style="font-size: 0.9em; color: #666; margin-bottom: 5px;">${upgrade.effect}</div>
                    <div class="building-cost">🪙 ${upgrade.cost}</div>
                    ${owned ? `<div style="color: #4CAF50; margin-top: 8px; font-weight: bold;">✓ Куплено</div>` : ''}
                `;

                if (!owned && canAfford) {
                    card.onclick = () => buyUpgrade(upgrade);
                }

                grid.appendChild(card);
            });
        }

        // ПОКУПКА ЗДАНИЯ
        function buyBuilding(building) {
            if (gameData.coins < building.cost) {
                showNotification('❌ Недостаточно монет', `Тебе нужно еще ${building.cost - gameData.coins} монет`);
                return;
            }

            if (gameData.level < building.requiredLevel) {
                showNotification('🔒 Закрыто', `Достигни ${building.requiredLevel} уровня`);
                return;
            }

            if (gameData.buildings.length >= 9) {
                showNotification('🏝️ Остров заполнен', 'На острове нет свободного места!');
                return;
            }

            gameData.coins -= building.cost;
            gameData.buildings.push(building.id);
            gameData.totalBuildings++;

            // Прогресс квеста
            if (gameData.quests.daily_building !== undefined) {
                gameData.quests.daily_building++;
                checkQuests();
            }

            saveGameData();
            updateUI();
            renderKingdom();
            renderShop();
            checkAchievements();

            showNotification('🎉 Здание построено!', `${building.icon} ${building.name} появилось на твоём острове!`);
        }

        // ПОКУПКА УЛУЧШЕНИЯ
        function buyUpgrade(upgrade) {
            if (gameData.coins < upgrade.cost) {
                showNotification('❌ Недостаточно монет', `Тебе нужно еще ${upgrade.cost - gameData.coins} монет`);
                return;
            }

            if (gameData.achievements[upgrade.id]) {
                showNotification('✓ Уже куплено', 'У тебя уже есть это улучшение!');
                return;
            }

            gameData.coins -= upgrade.cost;
            gameData.achievements[upgrade.id] = true;

            saveGameData();
            updateUI();
            renderUpgrades();

            showNotification('✨ Улучшение куплено!', `${upgrade.icon} ${upgrade.name}\n${upgrade.effect}`);
        }

        // ГЕНЕРАЦИЯ ВОПРОСА
        function generateQuestion() {
            const difficulty = gameData.difficulty;
            let question, answer;

            if (difficulty === 'easy') {
                const type = Math.random() > 0.5 ? 'add' : 'sub';
                if (type === 'add') {
                    const a = Math.floor(Math.random() * 10) + 1;
                    const b = Math.floor(Math.random() * (20 - a)) + 1;
                    question = `${a} + ${b}`;
                    answer = a + b;
                } else {
                    const a = Math.floor(Math.random() * 19) + 2;
                    const b = Math.floor(Math.random() * (a - 1)) + 1;
                    question = `${a} - ${b}`;
                    answer = a - b;
                }
            } else if (difficulty === 'medium') {
                const type = Math.random();
                if (type < 0.4) {
                    const a = Math.floor(Math.random() * 50) + 1;
                    const b = Math.floor(Math.random() * 50) + 1;
                    question = `${a} + ${b}`;
                    answer = a + b;
                } else if (type < 0.7) {
                    const a = Math.floor(Math.random() * 90) + 10;
                    const b = Math.floor(Math.random() * a) + 1;
                    question = `${a} - ${b}`;
                    answer = a - b;
                } else {
                    const a = Math.floor(Math.random() * 9) + 2;
                    const b = Math.floor(Math.random() * 9) + 2;
                    question = `${a} × ${b}`;
                    answer = a * b;
                }
            } else {
                const type = Math.random();
                if (type < 0.3) {
                    const a = Math.floor(Math.random() * 100) + 1;
                    const b = Math.floor(Math.random() * 100) + 1;
                    question = `${a} + ${b}`;
                    answer = a + b;
                } else if (type < 0.5) {
                    const a = Math.floor(Math.random() * 150) + 50;
                    const b = Math.floor(Math.random() * 50) + 1;
                    question = `${a} - ${b}`;
                    answer = a - b;
                } else if (type < 0.8) {
                    const a = Math.floor(Math.random() * 12) + 2;
                    const b = Math.floor(Math.random() * 12) + 2;
                    question = `${a} × ${b}`;
                    answer = a * b;
                } else {
                    const b = Math.floor(Math.random() * 9) + 2;
                    const ans = Math.floor(Math.random() * 9) + 1;
                    const a = b * ans;
                    question = `${a} ÷ ${b}`;
                    answer = ans;
                }
            }

            return { question, answer };
        }

        function generateAnswers(correctAnswer) {
            const answers = [correctAnswer];

            while (answers.length < 4) {
                const offset = Math.floor(Math.random() * 10) - 5;
                const wrongAnswer = correctAnswer + offset;
                if (wrongAnswer > 0 && !answers.includes(wrongAnswer)) {
                    answers.push(wrongAnswer);
                }
            }

            return answers.sort(() => Math.random() - 0.5);
        }

        // НАЧАТЬ ВОПРОС
        function startQuestion() {
            gameData.currentQuestion = generateQuestion();

            document.getElementById('questionText').textContent = gameData.currentQuestion.question + ' = ?';
            document.getElementById('questionBox').classList.add('active');
            document.getElementById('solveBtn').disabled = true;
            document.getElementById('rewardMessage').classList.remove('show');

            const answersGrid = document.getElementById('answersGrid');
            answersGrid.innerHTML = '';

            const answers = generateAnswers(gameData.currentQuestion.answer);
            answers.forEach(ans => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans;
                btn.onclick = () => checkAnswer(ans);
                answersGrid.appendChild(btn);
            });
        }

        // ПРОВЕРКА ОТВЕТА
        function checkAnswer(answer) {
            const correct = answer === gameData.currentQuestion.answer;
            const buttons = document.querySelectorAll('.answer-btn');

            buttons.forEach(btn => {
                btn.onclick = null;
                if (parseInt(btn.textContent) === gameData.currentQuestion.answer) {
                    btn.classList.add('correct');
                } else if (parseInt(btn.textContent) === answer && !correct) {
                    btn.classList.add('wrong');
                }
            });

            if (correct) {
                gameData.totalCorrect++;
                gameData.combo++;

                // Прогресс квестов
                if (gameData.quests.daily_5 !== undefined) {
                    gameData.quests.daily_5++;
                }
                if (gameData.quests.daily_combo !== undefined && gameData.combo >= 3) {
                    gameData.quests.daily_combo = 3;
                }
                checkQuests();

                let coinReward = 10;
                let xpReward = 5;

                // Множители от сложности
                if (gameData.difficulty === 'medium') {
                    coinReward = Math.floor(coinReward * 1.5);
                    xpReward = Math.floor(xpReward * 1.5);
                } else if (gameData.difficulty === 'hard') {
                    coinReward = Math.floor(coinReward * 2);
                    xpReward = Math.floor(xpReward * 2);
                }

                // Бонусы от комбо
                if (gameData.combo >= 10) {
                    coinReward = Math.floor(coinReward * 5);
                    xpReward = Math.floor(xpReward * 5);
                } else if (gameData.combo >= 5) {
                    coinReward = Math.floor(coinReward * 3);
                    xpReward = Math.floor(xpReward * 3);
                } else if (gameData.combo >= 3) {
                    coinReward = Math.floor(coinReward * 1.5);
                    xpReward = Math.floor(xpReward * 1.5);
                }

                // Бонусы от улучшений
                if (gameData.achievements.coin_bonus) {
                    coinReward = Math.floor(coinReward * 1.2);
                }
                if (gameData.achievements.xp_bonus) {
                    xpReward = Math.floor(xpReward * 1.3);
                }

                gameData.coins += coinReward;
                gameData.xp += xpReward;

                const xpNeeded = getXPForLevel(gameData.level + 1);
                if (gameData.xp >= xpNeeded) {
                    gameData.xp -= xpNeeded;
                    gameData.level++;

                    if (gameData.level >= 3 && gameData.mathClass < 2) {
                        gameData.mathClass = 2;
                    }
                    if (gameData.level >= 5 && gameData.mathClass < 3) {
                        gameData.mathClass = 3;
                    }

                    showNotification('🎉 Новый уровень!', `Поздравляем! Ты достиг ${gameData.level} уровня! Бонус: +100 🪙`);
                    gameData.coins += 100;
                }

                saveGameData();
                updateUI();
                renderShop();
                checkAchievements();

                const rewardMsg = document.getElementById('rewardMessage');
                rewardMsg.innerHTML = `✅ Правильно!<br>+${coinReward} 🪙  +${xpReward} XP`;
                rewardMsg.style.background = 'linear-gradient(135deg, #4CAF50 0%, #8BC34A 100%)';
                rewardMsg.classList.add('show');

            } else {
                // Проверка щита комбо
                if (!gameData.achievements.combo_shield || gameData.combo === 0) {
                    gameData.combo = 0;
                } else {
                    showNotification('🛡️ Щит комбо!', 'Твоя серия сохранена!');
                    gameData.achievements.combo_shield = false; // Используем щит
                }

                gameData.totalWrong++;
                saveGameData();
                updateUI();

                const rewardMsg = document.getElementById('rewardMessage');
                rewardMsg.innerHTML = `❌ Неправильно. Правильный ответ: ${gameData.currentQuestion.answer}<br>Попробуй еще раз!`;
                rewardMsg.style.background = 'linear-gradient(135deg, #eb3349 0%, #f45c43 100%)';
                rewardMsg.classList.add('show');
            }

            setTimeout(() => {
                document.getElementById('questionBox').classList.remove('active');
                document.getElementById('solveBtn').disabled = false;
                document.getElementById('rewardMessage').classList.remove('show');
            }, 2500);
        }

        // ЕЖЕДНЕВНАЯ НАГРАДА
        function checkDailyReward() {
            const today = new Date().toDateString();
            if (gameData.lastDailyReward !== today) {
                document.getElementById('dailyBtn').classList.add('has-notification');
            }
        }

        function showDailyReward() {
            const today = new Date().toDateString();
            if (gameData.lastDailyReward === today) {
                showNotification('⏰ Возвращайся завтра', 'Ты уже получил награду сегодня!');
                return;
            }

            const reward = 100;
            gameData.coins += reward;
            gameData.lastDailyReward = today;

            // Сброс квестов
            gameData.quests = { daily_5: 0, daily_combo: 0, daily_building: 0 };

            saveGameData();
            updateUI();

            document.getElementById('dailyBtn').classList.remove('has-notification');
            showNotification('🎁 Ежедневная награда!', `Ты получил ${reward} монет! Возвращайся завтра!`);
        }

        // ДОСТИЖЕНИЯ
        function checkAchievements() {
            achievements.forEach(ach => {
                if (!gameData.achievements[ach.id] && ach.check()) {
                    gameData.achievements[ach.id] = true;
                    gameData.coins += ach.reward;
                    saveGameData();
                    showNotification(`🏆 Достижение: ${ach.name}`, `${ach.desc}\nНаграда: +${ach.reward} 🪙`);
                }
            });
        }

        function showAchievements() {
            const content = document.getElementById('modalContent');
            content.innerHTML = '<div class="achievement-list"></div>';
            const list = content.querySelector('.achievement-list');

            achievements.forEach(ach => {
                const completed = gameData.achievements[ach.id];
                const item = document.createElement('div');
                item.className = 'achievement-item' + (completed ? ' completed' : ' locked');

                item.innerHTML = `
                    <div class="achievement-icon">${ach.icon}</div>
                    <div class="achievement-info">
                        <div class="achievement-name">${ach.name}</div>
                        <div class="achievement-desc">${ach.desc}</div>
                        <div class="achievement-reward">${completed ? '✓ Выполнено' : `Награда: ${ach.reward} 🪙`}</div>
                    </div>
                `;

                list.appendChild(item);
            });

            document.getElementById('modalTitle').textContent = '🏆 Достижения';
            document.getElementById('modal').classList.add('show');
        }

        // КВЕСТЫ
        function checkQuests() {
            const q = gameData.quests;

            if (q.daily_5 >= 5 && q.daily_5 < 100) {
                gameData.coins += 50;
                q.daily_5 = 100; // Помечаем как выполненный
                showNotification('✓ Квест выполнен!', 'Ежедневная разминка\n+50 🪙');
            }

            if (q.daily_combo >= 3 && q.daily_combo < 100) {
                gameData.coins += 75;
                q.daily_combo = 100;
                showNotification('✓ Квест выполнен!', 'Серия дня\n+75 🪙');
            }

            if (q.daily_building >= 1 && q.daily_building < 100) {
                gameData.coins += 100;
                q.daily_building = 100;
                showNotification('✓ Квест выполнен!', 'Строительство\n+100 🪙');
            }

            saveGameData();
            updateUI();
        }

        function showQuests() {
            const content = document.getElementById('modalContent');
            content.innerHTML = '<div class="achievement-list"></div>';
            const list = content.querySelector('.achievement-list');

            const questsData = [
                { id: 'daily_5', name: 'Ежедневная разминка', desc: 'Реши 5 примеров', icon: '📝', reward: 50, target: 5 },
                { id: 'daily_combo', name: 'Серия дня', desc: 'Набери серию из 3', icon: '🔥', reward: 75, target: 3 },
                { id: 'daily_building', name: 'Строительство', desc: 'Построй 1 здание', icon: '🏗️', reward: 100, target: 1 }
            ];

            questsData.forEach(quest => {
                const progress = gameData.quests[quest.id] || 0;
                const completed = progress >= quest.target;
                const item = document.createElement('div');
                item.className = 'achievement-item' + (completed ? ' completed' : '');

                item.innerHTML = `
                    <div class="achievement-icon">${quest.icon}</div>
                    <div class="achievement-info">
                        <div class="achievement-name">${quest.name}</div>
                        <div class="achievement-desc">${quest.desc}</div>
                        <div class="achievement-reward">
                            ${completed ? '✓ Выполнено' : `Прогресс: ${Math.min(progress, quest.target)}/${quest.target}`}
                        </div>
                    </div>
                `;

                list.appendChild(item);
            });

            document.getElementById('modalTitle').textContent = '📜 Ежедневные квесты';
            document.getElementById('modal').classList.add('show');
        }

        // УВЕДОМЛЕНИЯ
        function showNotification(title, text) {
            document.getElementById('notificationTitle').textContent = title;
            document.getElementById('notificationText').textContent = text;
            document.getElementById('notification').classList.add('show');
        }

        function closeNotification() {
            document.getElementById('notification').classList.remove('show');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('show');
        }

        // ЗАПУСК
        init();
    </script>
</body>
</html>
