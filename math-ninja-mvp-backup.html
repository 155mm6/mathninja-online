<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🥷 Математический Ниндзя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        /* ГЛАВНОЕ МЕНЮ */
        .menu-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100vh;
            padding: 20px;
        }

        .menu-screen.hidden {
            display: none;
        }

        .game-title {
            font-size: clamp(2.5em, 8vw, 4em);
            color: #FFD700;
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 40px;
            animation: titlePulse 2s ease-in-out infinite;
            text-align: center;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .menu-buttons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .menu-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            border: none;
            padding: 20px 40px;
            font-size: clamp(1.2em, 3vw, 1.5em);
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(255, 107, 107, 0.6);
        }

        /* ИГРОВОЙ ЭКРАН */
        .game-screen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .game-screen.active {
            display: flex;
        }

        /* ВЕРХНЯЯ ПАНЕЛЬ */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 3px solid #FFD700;
            z-index: 100;
        }

        .score-display {
            font-size: clamp(1.5em, 4vw, 2em);
            color: #FFD700;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .timer {
            font-size: clamp(1.8em, 5vw, 2.5em);
            color: #4CAF50;
            font-weight: bold;
        }

        .timer.warning {
            color: #FF6B6B;
            animation: timerBlink 0.5s ease-in-out infinite;
        }

        @keyframes timerBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ПРИМЕР ВВЕРХУ */
        .question-area {
            padding: 30px 20px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-bottom: 3px solid #FFD700;
        }

        .question-display {
            font-size: clamp(2.5em, 7vw, 4em);
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
            font-weight: bold;
        }

        /* ИГРОВАЯ ОБЛАСТЬ */
        .game-area {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        /* ФРУКТЫ-ОТВЕТЫ */
        .fruit {
            position: absolute;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.1s ease;
        }

        .fruit-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.6);
            border: 4px solid #FFD700;
        }

        .fruit-number {
            position: relative;
            font-size: 2.5em;
            color: white;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 5;
        }

        .fruit.slashed {
            pointer-events: none;
        }

        .fruit.slashed .fruit-bg {
            animation: fruitExplode 0.5s ease-out forwards;
        }

        @keyframes fruitExplode {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            50% { transform: scale(1.2) rotate(180deg); opacity: 0.8; }
            100% { transform: scale(0) rotate(360deg); opacity: 0; }
        }

        /* ЭФФЕКТ РАЗРЕЗАНИЯ */
        .slash-effect {
            position: fixed;
            font-size: 5em;
            color: #FFD700;
            pointer-events: none;
            z-index: 1000;
            animation: slashAnim 0.6s ease-out forwards;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9);
        }

        @keyframes slashAnim {
            0% { transform: scale(0) rotate(-45deg); opacity: 1; }
            50% { transform: scale(1.5) rotate(0deg); opacity: 1; }
            100% { transform: scale(2) rotate(45deg); opacity: 0; }
        }

        /* ВСПЛЫВАЮЩИЕ ОЧКИ */
        .score-popup {
            position: fixed;
            font-size: 2.5em;
            font-weight: bold;
            pointer-events: none;
            z-index: 1000;
            animation: scoreFloat 1s ease-out forwards;
            text-shadow: 0 0 15px currentColor;
        }

        .score-popup.plus {
            color: #4CAF50;
        }

        .score-popup.minus {
            color: #FF6B6B;
        }

        @keyframes scoreFloat {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
        }

        /* ЧАСТИЦЫ */
        .particle {
            position: fixed;
            pointer-events: none;
            z-index: 999;
            font-size: 1.5em;
        }

        @keyframes particleFloat {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0) rotate(360deg); opacity: 0; }
        }

        /* ЭКРАН РЕЗУЛЬТАТОВ */
        .result-screen {
            display: none;
            width: 100%;
            height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .result-screen.active {
            display: flex;
        }

        .result-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px;
            border: 5px solid #FFD700;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .result-title {
            font-size: clamp(2.5em, 6vw, 3.5em);
            color: #FFD700;
            margin-bottom: 30px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-stat {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
        }

        .result-label {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 10px;
        }

        .result-value {
            font-size: 2.5em;
            color: white;
            font-weight: bold;
        }

        /* АДАПТИВНОСТЬ */
        @media (max-width: 768px) {
            .fruit {
                width: 100px;
                height: 100px;
            }

            .fruit-number {
                font-size: 2em;
            }

            .result-stats {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 480px) {
            .fruit {
                width: 80px;
                height: 80px;
            }

            .fruit-number {
                font-size: 1.8em;
            }

            .question-display {
                font-size: clamp(2em, 6vw, 3em);
            }
        }
    </style>
</head>
<body>
    <!-- ГЛАВНОЕ МЕНЮ -->
    <div class="menu-screen" id="menuScreen">
        <div class="game-title">🥷 МАТЕМАТИЧЕСКИЙ<br>НИНДЗЯ</div>
        <div class="menu-buttons">
            <button class="menu-btn" onclick="game.start()">⚔️ НАЧАТЬ ИГРУ</button>
        </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН -->
    <div class="game-screen" id="gameScreen">
        <div class="game-header">
            <div class="score-display">Очки: <span id="score">0</span></div>
            <div class="timer" id="timer">60</div>
        </div>

        <div class="question-area">
            <div class="question-display" id="question">8 + 7 = ?</div>
        </div>

        <div class="game-area" id="gameArea"></div>
    </div>

    <!-- ЭКРАН РЕЗУЛЬТАТОВ -->
    <div class="result-screen" id="resultScreen">
        <div class="result-container">
            <div class="result-title">🏆 РЕЗУЛЬТАТ</div>

            <div class="result-stats">
                <div class="result-stat">
                    <div class="result-label">Очки</div>
                    <div class="result-value" id="finalScore">0</div>
                </div>
                <div class="result-stat">
                    <div class="result-label">Правильных</div>
                    <div class="result-value" id="finalCorrect">0</div>
                </div>
                <div class="result-stat">
                    <div class="result-label">Ошибок</div>
                    <div class="result-value" id="finalWrong">0</div>
                </div>
                <div class="result-stat">
                    <div class="result-label">Точность</div>
                    <div class="result-value" id="finalAccuracy">0%</div>
                </div>
            </div>

            <div class="menu-buttons">
                <button class="menu-btn" onclick="game.start()">Еще раз</button>
                <button class="menu-btn" onclick="game.showMenu()">В меню</button>
            </div>
        </div>
    </div>

    <script>
        const game = {
            state: {
                score: 0,
                correct: 0,
                wrong: 0,
                timeLeft: 60,
                isPlaying: false,
                currentQuestion: null,
                spawnInterval: null,
                timer: null
            },

            // Генератор примеров
            generateQuestion() {
                const operations = [
                    { op: '+', calc: (a, b) => a + b },
                    { op: '−', calc: (a, b) => a - b },
                    { op: '×', calc: (a, b) => a * b }
                ];

                const operation = operations[Math.floor(Math.random() * operations.length)];
                let a, b, answer;

                if (operation.op === '+') {
                    a = Math.floor(Math.random() * 20) + 1;
                    b = Math.floor(Math.random() * 20) + 1;
                } else if (operation.op === '−') {
                    a = Math.floor(Math.random() * 20) + 10;
                    b = Math.floor(Math.random() * a) + 1;
                } else {
                    a = Math.floor(Math.random() * 9) + 2;
                    b = Math.floor(Math.random() * 9) + 2;
                }

                answer = operation.calc(a, b);

                // Генерация неправильных ответов
                const wrongAnswers = [];
                while (wrongAnswers.length < 2) {
                    const wrong = answer + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
                    if (wrong > 0 && wrong !== answer && !wrongAnswers.includes(wrong)) {
                        wrongAnswers.push(wrong);
                    }
                }

                const allAnswers = [answer, ...wrongAnswers].sort(() => Math.random() - 0.5);

                return {
                    text: `${a} ${operation.op} ${b} = ?`,
                    correct: answer,
                    options: allAnswers
                };
            },

            // Запуск игры
            start() {
                this.state = {
                    score: 0,
                    correct: 0,
                    wrong: 0,
                    timeLeft: 60,
                    isPlaying: true,
                    currentQuestion: null,
                    spawnInterval: null,
                    timer: null
                };

                document.getElementById('menuScreen').classList.add('hidden');
                document.getElementById('gameScreen').classList.add('active');
                document.getElementById('resultScreen').classList.remove('active');

                this.updateUI();
                this.nextQuestion();
                this.startTimer();
                this.startSpawning();
            },

            // Таймер
            startTimer() {
                this.state.timer = setInterval(() => {
                    this.state.timeLeft--;
                    const timerEl = document.getElementById('timer');
                    timerEl.textContent = this.state.timeLeft;

                    if (this.state.timeLeft <= 10) {
                        timerEl.classList.add('warning');
                    }

                    if (this.state.timeLeft <= 0) {
                        this.endGame();
                    }
                }, 1000);
            },

            // Обновление интерфейса
            updateUI() {
                document.getElementById('score').textContent = this.state.score;
                document.getElementById('timer').textContent = this.state.timeLeft;
            },

            // Следующий вопрос
            nextQuestion() {
                this.state.currentQuestion = this.generateQuestion();
                document.getElementById('question').textContent = this.state.currentQuestion.text;
            },

            // Запуск спавна фруктов
            startSpawning() {
                this.spawnFruit();
                this.state.spawnInterval = setInterval(() => {
                    if (this.state.isPlaying) {
                        this.spawnFruit();
                    }
                }, 1500);
            },

            // Спавн одного фрукта
            spawnFruit() {
                if (!this.state.currentQuestion) return;

                const option = this.state.currentQuestion.options[
                    Math.floor(Math.random() * this.state.currentQuestion.options.length)
                ];

                const fruit = document.createElement('div');
                fruit.className = 'fruit';

                const startX = Math.random() * (window.innerWidth - 120);
                const startY = window.innerHeight + 120;

                fruit.style.left = startX + 'px';
                fruit.style.bottom = '-120px';

                fruit.innerHTML = `
                    <div class="fruit-bg"></div>
                    <div class="fruit-number">${option}</div>
                `;

                fruit.dataset.value = option;
                fruit.dataset.correct = (option === this.state.currentQuestion.correct) ? 'true' : 'false';

                // Клик по фрукту
                fruit.addEventListener('click', (e) => this.slashFruit(fruit, e));
                fruit.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.slashFruit(fruit, e.touches[0]);
                });

                document.getElementById('gameArea').appendChild(fruit);

                // Анимация вылета
                const duration = 2000 + Math.random() * 1000;
                const targetY = -window.innerHeight * 0.6 - Math.random() * 200;
                const horizontalMove = (Math.random() - 0.5) * 200;

                const startTime = Date.now();
                const animate = () => {
                    if (!this.state.isPlaying) {
                        fruit.remove();
                        return;
                    }

                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // Параболическая траектория
                    const y = startY + (targetY - startY) * progress;
                    const x = startX + horizontalMove * progress;
                    const rotation = progress * 360;

                    fruit.style.transform = `translate(${x - startX}px, ${y - startY}px) rotate(${rotation}deg)`;

                    if (progress < 1) {
                        requestAnimationFrame(animate);
                    } else {
                        fruit.remove();
                    }
                };

                requestAnimationFrame(animate);
            },

            // Рубим фрукт
            slashFruit(fruit, event) {
                if (fruit.classList.contains('slashed')) return;

                fruit.classList.add('slashed');

                const value = parseInt(fruit.dataset.value);
                const isCorrect = fruit.dataset.correct === 'true';

                if (isCorrect) {
                    this.state.score += 10;
                    this.state.correct++;
                    this.showScorePopup('+10', event.clientX, event.clientY, true);
                    this.showSlashEffect(event.clientX, event.clientY);
                    this.createParticles(event.clientX, event.clientY, '#4CAF50');

                    // Следующий вопрос через небольшую задержку
                    setTimeout(() => this.nextQuestion(), 300);
                } else {
                    this.state.score = Math.max(0, this.state.score - 5);
                    this.state.wrong++;
                    this.showScorePopup('-5', event.clientX, event.clientY, false);
                    this.createParticles(event.clientX, event.clientY, '#FF6B6B');
                }

                this.updateUI();

                setTimeout(() => {
                    if (fruit.parentNode) {
                        fruit.remove();
                    }
                }, 500);
            },

            // Эффект разрезания
            showSlashEffect(x, y) {
                const slash = document.createElement('div');
                slash.className = 'slash-effect';
                slash.textContent = '⚔️';
                slash.style.left = x + 'px';
                slash.style.top = y + 'px';
                document.body.appendChild(slash);

                setTimeout(() => slash.remove(), 600);
            },

            // Всплывающие очки
            showScorePopup(text, x, y, isPositive) {
                const popup = document.createElement('div');
                popup.className = 'score-popup ' + (isPositive ? 'plus' : 'minus');
                popup.textContent = text;
                popup.style.left = x + 'px';
                popup.style.top = y + 'px';
                document.body.appendChild(popup);

                setTimeout(() => popup.remove(), 1000);
            },

            // Частицы
            createParticles(x, y, color) {
                for (let i = 0; i < 8; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.textContent = '✨';
                    particle.style.left = x + 'px';
                    particle.style.top = y + 'px';
                    particle.style.color = color;
                    particle.style.setProperty('--tx', (Math.random() - 0.5) * 200 + 'px');
                    particle.style.setProperty('--ty', (Math.random() - 0.5) * 200 + 'px');
                    particle.style.animation = `particleFloat ${0.8 + Math.random() * 0.4}s ease-out forwards`;
                    document.body.appendChild(particle);

                    setTimeout(() => particle.remove(), 1200);
                }
            },

            // Конец игры
            endGame() {
                this.state.isPlaying = false;
                clearInterval(this.state.timer);
                clearInterval(this.state.spawnInterval);

                // Удаляем оставшиеся фрукты
                document.getElementById('gameArea').innerHTML = '';

                // Показываем результаты
                const accuracy = this.state.correct + this.state.wrong > 0
                    ? Math.round((this.state.correct / (this.state.correct + this.state.wrong)) * 100)
                    : 0;

                document.getElementById('finalScore').textContent = this.state.score;
                document.getElementById('finalCorrect').textContent = this.state.correct;
                document.getElementById('finalWrong').textContent = this.state.wrong;
                document.getElementById('finalAccuracy').textContent = accuracy + '%';

                document.getElementById('gameScreen').classList.remove('active');
                document.getElementById('resultScreen').classList.add('active');
            },

            // Возврат в меню
            showMenu() {
                document.getElementById('menuScreen').classList.remove('hidden');
                document.getElementById('resultScreen').classList.remove('active');
                document.getElementById('gameScreen').classList.remove('active');
            }
        };

        // Предотвращение скролла на мобильных
        document.addEventListener('touchmove', (e) => {
            if (e.target.closest('.game-area')) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>
